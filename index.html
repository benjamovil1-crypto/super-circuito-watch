<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Super CircuitoApp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000; color: #e8f2ff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: hidden;
        }
        .watch-face {
            width: 100vmin; height: 100vmin; border-radius: 50%;
            background: radial-gradient(circle at center, #060c25 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 15% 12% 10% 12%;
            position: relative; box-shadow: inset 0 0 40px rgba(30, 95, 168, 0.4);
        }
        #clock { font-size: 9vmin; font-weight: 700; color: #7ec8f5; line-height: 1; }
        .health { font-size: 3.5vmin; color: #5ce875; margin-top: 4px; }
        .task-list { flex: 1; width: 100%; overflow-y: auto; margin: 5% 0; padding: 0 4%; scrollbar-width: none; display: flex; flex-direction: column; gap: 8px; }
        .task-list::-webkit-scrollbar { display: none; }
        .task-item { background: rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 10px; display: flex; align-items: center; gap: 10px; border-left: 4px solid #1e5fa8; }
        .task-item.done { opacity: 0.3; }
        .task-title { font-size: 3.8vmin; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .footer { display: flex; gap: 10px; margin-bottom: 8%; }
        .btn-sos { width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 60, 60, 0.2); border: 2px solid #ff6060; color: #ff6060; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .btn-install { padding: 0 20px; height: 50px; border-radius: 25px; background: #1e5fa8; border: 1px solid #7ec8f5; color: white; font-weight: bold; font-size: 3vmin; display: none; }
    </style>
</head>
<body>
    <div class="watch-face">
        <div class="header">
            <div id="clock">00:00</div>
            <div class="health">❤ <span id="bpm">72</span> BPM</div>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="footer">
            <button class="btn-sos" onclick="triggerCrisis()">⚠</button>
            <button id="installBtn" class="btn-install">INSTALAR APP</button>
        </div>
    </div>

    <script>
        let tasks = [
            { id: 1, title: 'Cita Precursores', done: true },
            { id: 2, title: 'Salida al Campo', done: false },
            { id: 3, title: 'Pastoreo Fam. Glez', done: false }
        ];

        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map(t => `
                <div class="task-item ${t.done ? 'done' : ''}" onclick="toggle(${t.id})">
                    <div style="width:15px; height:15px; border-radius:50%; border:2px solid ${t.done?'#5ce875':'#555'}; background:${t.done?'#5ce875':'transparent'}"></div>
                    <div class="task-title">${t.title}</div>
                </div>
            `).join('');
        }

        function toggle(id) {
            const t = tasks.find(x => x.id === id);
            t.done = !t.done;
            if (navigator.vibrate) navigator.vibrate(40);
            render();
        }

        function triggerCrisis() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            alert("Crisis: Esperanza notificada");
        }

        function update() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('bpm').innerText = 68 + Math.floor(Math.random() * 10);
        }

        setInterval(update, 1000);
        update(); render();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
