<body>

    <div class="watch-shell">
        <!-- CABECERA INTELIGENTE -->
        <div class="header">
            <div id="clock">00:00</div>
            <div id="cong-info" style="color: #ffd060;">CONG. EJEMPLO</div>
            <div id="week-pill" class="status-pill">DETECTANDO...</div>
        </div>

        <!-- FLUJO UNIFICADO -->
        <div class="unified-flow" id="main-flow">
            <!-- Aquí se mezclan tareas de CircuitoApp y Asistente 360 -->
        </div>

        <!-- ACCIONES -->
        <div class="footer">
            <button class="btn-action" onclick="showSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <button class="btn-action" onclick="refreshData()">🔄</button>
        </div>

        <!-- OVERLAY SOS -->
        <div id="sos-overlay" onclick="this.style.display='none'">
            <div style="font-size: 40px; color: #ff6060;">⚠</div>
            <div style="font-size: 18px; font-weight: bold;">CRISIS</div>
            <p style="font-size: 11px; opacity: 0.7; margin-top: 4px;">Esperanza alertada</p>
        </div>
    </div>

    <script>
        // PROGRAMACIÓN DE EJEMPLO (Esto simula los datos de tu calendario)
        // En una implementación real, esto se leería de tu base de datos de Google/Samsung
        const SCHEDULE = [
            { start: '2024-03-01', end: '2024-03-07', cong: 'Cong. Centro', type: 'visit' },
            { start: '2024-03-08', end: '2024-03-14', cong: 'Asamblea Regional', type: 'assembly' },
            { start: '2024-03-15', end: '2024-03-21', cong: 'Cong. Norte', type: 'precursor' }
        ];

        const STORAGE_KEY = 'benjamin_unified_v1';
        let state = JSON.parse(localStorage.getItem(STORAGE_ID = STORAGE_KEY)) || {
            doneIds: []
        };

        function getActiveWeek() {
            const today = new Date();
            // Para propósitos de demo, si no hay match, devolvemos 'visit' por defecto
            const match = SCHEDULE.find(s => {
                const start = new Date(s.start);
                const end = new Date(s.end);
                return today >= start && today <= end;
            });
            return match || { type: 'visit', cong: 'Sin Asignación' };
        }

        function getTasks(type) {
            const circuitTasks = {
                visit: ['Revisar Registros', 'Reunión Ancianos', 'Salida al Campo'],
                assembly: ['Reunión Oradores', 'Logística Auditorio', 'Cierre Cuentas'],
                precursor: ['Clase Servicio', 'Revisión Informes']
            };
            const assistantTasks = ['Tomar Agua', 'Control Pulso', 'Breve Descanso'];
            
            return [
                ...circuitTasks[type].map(t => ({ t, src: 'CircuitoApp' })),
                ...assistantTasks.map(t => ({ t, src: 'Asistente 360' }))
            ];
        }

        function render() {
            const flow = document.getElementById('main-flow');
            const pill = document.getElementById('week-pill');
            const cong = document.getElementById('cong-info');
            
            const active = getActiveWeek();
            const config = {
                visit: { color: '#5ce875', label: 'Semana de Visita' },
                assembly: { color: '#7ec8f5', label: 'Semana de Asamblea' },
                precursor: { color: '#ffd060', label: 'Semana Precursores' }
            };

            const ui = config[active.type];
            cong.innerText = active.cong;
            pill.innerText = ui.label;
            pill.style.background = ui.color;
            pill.style.color = '#000';

            const tasks = getTasks(active.type);
            flow.innerHTML = tasks.map((task, idx) => {
                const isDone = state.doneIds.includes(`${active.type}-${idx}`);
                return `
                    <div class="task-card ${isDone ? 'done' : ''}" 
                         style="border-left-color: ${ui.color}"
                         onclick="toggleTask('${active.type}-${idx}')">
                        <div style="flex:1">
                            <span class="source-tag">${task.src}</span>
                            <span>${task.t}</span>
                        </div>
                        <div style="width:14px; height:14px; border-radius:50%; border:1.5px solid ${ui.color}; background:${isDone ? ui.color : 'transparent'}"></div>
                    </div>
                `;
            }).join('');
        }

        function toggleTask(id) {
            if(state.doneIds.includes(id)) {
                state.doneIds = state.doneIds.filter(i => i !== id);
            } else {
                state.doneIds.push(id);
                if (navigator.vibrate) navigator.vibrate(40);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render();
        }

        function showSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function refreshData() {
            if (navigator.vibrate) navigator.vibrate(60);
            render();
        }

        function tick() {
            const d = new Date();
            document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        setInterval(tick, 1000);
        tick();
        render();
    </script>
</body>
</html>
