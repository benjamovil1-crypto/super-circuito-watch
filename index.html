<body>

    <div class="watch-face">
        <div class="glow"></div>
        <div class="label-top">MODO VISITA</div>

        <!-- HEADER -->
        <div class="header">
            <div id="clock">00:00</div>
            <div class="health-status">
                <span style="font-size: 12px;">❤</span> <span id="bpm">72</span> BPM · OK
            </div>
        </div>

        <!-- FLUJO DE TRABAJO -->
        <div class="task-list" id="taskList">
            <!-- Las tareas se cargan por JS -->
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <button class="btn-sos" onclick="triggerSOS()">⚠</button>
            <button class="btn-next" onclick="showNext()">SIGUIENTE</button>
        </div>
    </div>

    <script>
        // DATOS INICIALES (Sincronizados con tus colores)
        let tasks = [
            { id: 1, time: '09:00', title: 'Cita Precursores', type: 'precursor', done: true },
            { id: 2, time: '11:00', title: 'Salida al Campo', type: 'visit', done: false },
            { id: 3, time: '18:00', title: 'Pastoreo Fam. Glez', type: 'pastoreo', done: false },
            { id: 4, time: '19:30', title: 'Reunión Vida y Min.', type: 'meeting', done: false }
        ];

        function getTaskColor(type) {
            const colors = {
                'precursor': '#ffd060', // Orange
                'visit': '#5ce875',     // Green
                'meeting': '#7ec8f5',   // Cyan
                'pastoreo': '#c084fc'    // Purple
            };
            return colors[type] || '#1e5fa8';
        }

        // RENDERIZAR LISTA
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-item ${task.done ? 'done' : ''}`;
                item.style.borderLeftColor = getTaskColor(task.type);
                item.onclick = () => toggleTask(task.id);
                
                item.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="task-info">
                        <div class="task-time">${task.time}</div>
                        <div class="task-title">${task.title}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                if (navigator.vibrate) navigator.vibrate(40);
                renderTasks();
            }
        }

        function triggerSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            alert("Crisis: Esperanza notificada");
        }

        function showNext() {
            const next = tasks.find(t => !t.done);
            alert(next ? "Siguiente: " + next.title : "¡Día completado!");
        }

        // RELOJ Y BPM SIMULADO
        function updateUI() {
            const now = new Date();
            document.getElementById('clock').innerText = 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0');
            
            // Simular pulso variable (Super Asistente 360)
            document.getElementById('bpm').innerText = 70 + Math.floor(Math.random() * 5);
        }

        setInterval(updateUI, 1000);
        updateUI();
        renderTasks();

        // SERVICE WORKER
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
