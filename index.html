```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente 360</title>
    <style>
        /* 1. DISEÑO BASE - TODO NEGRO Y CENTRADO */
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: Arial, sans-serif; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }

        /* 2. EL ANILLO AZUL (Safe Zone de 310px para tu Watch 7) */
        .circulo-watch {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 50px 30px; background: radial-gradient(circle, #04081a 0%, #000 100%);
        }

        /* 3. RELOJ Y SALUD */
        #hora { font-size: 28px; font-weight: bold; color: #7ec8f5; }
        .pulso { font-size: 14px; color: #5ce875; }

        /* 4. TAREAS (Simples, para tildar) */
        .tareas { flex: 1; width: 100%; margin: 10px 0; overflow-y: auto; }
        .item { 
            background: rgba(255,255,255,0.1); margin-bottom: 5px; 
            padding: 8px; border-radius: 10px; font-size: 14px; 
            display: flex; align-items: center; gap: 10px;
        }
        .item.listo { opacity: 0.3; text-decoration: line-through; }

        /* 5. BOTONES DE ABAJO */
        .botones { display: flex; gap: 20px; }
        .btn { 
            width: 40px; height: 40px; border-radius: 50%; 
            border: 1px solid #1e5fa8; color: white; background: none; 
            font-size: 18px; 
        }

        /* EMERGENCIA */
        #sos { 
            display: none; position: fixed; inset: 0; background: red; 
            justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="circulo-watch">
        <div>
            <div id="hora">00:00</div>
            <div class="pulso">❤ 72 BPM</div>
        </div>

        <div class="tareas">
            <div class="item" onclick="this.classList.toggle('listo')">
                <div style="width:10px;height:10px;border:1px solid #fff;border-radius:50%"></div>
                Cita Precursores
            </div>
            <div class="item" onclick="this.classList.toggle('listo')">
                <div style="width:10px;height:10px;border:1px solid #fff;border-radius:50%"></div>
                Salida al Campo
            </div>
        </div>

        <div class="botones">
            <button class="btn" onclick="document.getElementById('sos').style.display='flex'">⚠</button>
            <button class="btn" onclick="location.reload()">⚙</button>
        </div>
    </div>

    <div id="sos" onclick="this.style.display='none'">
        <h1>AVISO SOS</h1>
        <p>Toca para cerrar</p>
    </div>

    <script>
        function actualizar() {
            const d = new Date();
            document.getElementById('hora').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }
        setInterval(actualizar, 1000);
        actualizar();
    </script>
</body>
</html>
