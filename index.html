<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente 360 - Flujo</title>
    <style>
        /* CONFIGURACIÓN CRÍTICA: BLOQUEO DE TAMAÑOS PARA EVITAR ZOOM */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: none; }
        
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }

        /* ANILLO AZUL ESTABLE (310px - Safe Zone para Watch 7) */
        .reloj-shell {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 45px 32px 35px 32px; 
            background: radial-gradient(circle, #04081a 0%, #000 100%);
            position: relative;
            overflow: hidden;
        }

        /* CABECERA: RELOJ Y PESTAÑA ACTUAL */
        .header { text-align: center; width: 100%; z-index: 5; }
        #clock { font-size: 28px; font-weight: bold; color: #7ec8f5; line-height: 1; }
        
        /* INDICADOR DE PESTAÑA (Reflejo de la APK) */
        .tab-indicator { 
            font-size: 12px; font-weight: bold; margin-top: 4px; 
            padding: 2px 8px; border-radius: 10px;
            display: inline-block; text-transform: uppercase;
        }

        /* FLUJO DE TAREAS (SCROLLABLE) */
        .flow-container { 
            flex: 1; width: 100%; margin: 8px 0; 
            overflow-y: auto; scrollbar-width: none; 
            z-index: 5;
        }
        .flow-container::-webkit-scrollbar { display: none; }

        .task-card { 
            background: rgba(255,255,255,0.08); margin-bottom: 5px; 
            padding: 9px 12px; border-radius: 14px; font-size: 13.5px; 
            display: flex; align-items: center; gap: 10px;
            border-left: 4px solid #1e5fa8;
            transition: opacity 0.2s;
        }
        .task-card.done { opacity: 0.25; text-decoration: line-through; border-left-color: #444; }

        .check-box {
            width: 14px; height: 14px; border-radius: 4px;
            border: 1.5px solid rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* BOTONES (SOS Y CAMBIO DE PESTAÑA) */
        .footer-tools { display: flex; gap: 28px; z-index: 5; margin-bottom: 5px; }
        .btn-tool { 
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1.5px solid #1e5fa8; color: white; background: rgba(30,95,168,0.2); 
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }

        /* SOS: BORDÓ OSCURO ANTI-MIGRAÑA */
        #sos-screen { 
            display: none; position: absolute; inset: 0; 
            background: #2a0000; justify-content: center; 
            align-items: center; flex-direction: column;
            border-radius: 50%; text-align: center; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="reloj-shell">
        <!-- CABECERA -->
        <div class="header">
            <div id="clock">00:00</div>
            <div id="tab-label" class="tab-indicator">VISITA</div>
        </div>

        <!-- FLUJO DE TRABAJO (Pestañas de la APK) -->
        <div class="flow-container" id="task-list">
            <!-- Cargado por JS según la pestaña de la APK seleccionada -->
        </div>

        <!-- ACCIONES -->
        <div class="footer-tools">
            <!-- Alerta SOS Suave -->
            <button class="btn-tool" onclick="showSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <!-- Botón para rotar entre las pestañas de la APK -->
            <button class="btn-tool" onclick="cycleTabs()">⚙</button>
        </div>

        <!-- OVERLAY SOS -->
        <div id="sos-screen" onclick="this.style.display='none'">
            <div style="font-size: 40px; color: #ff6060;">⚠</div>
            <div style="font-size: 18px; font-weight: bold;">CRISIS</div>
            <p style="font-size: 11px; opacity: 0.8; margin-top: 4px;">Esperanza notificada</p>
        </div>
    </div>

    <script>
        // DATOS QUE REFLEJAN LAS PESTAÑAS DE LA APK
        const STORAGE_ID = 'benjamin_workflow_360';
        let state = JSON.parse(localStorage.getItem(STORAGE_ID)) || {
            currentTab: 'visit', // visit, assembly, precursor
            tasks: {
                visit: [
                    { id: 101, t: 'Revisar Registros', d: false },
                    { id: 102, t: 'Reunión Ancianos', d: false },
                    { id: 103, t: 'Salida al Campo', d: false },
                    { id: 104, t: 'Discurso Público', d: false }
                ],
                assembly: [
                    { id: 201, t: 'Reunión Oradores', d: false },
                    { id: 202, t: 'Revisión Audio', d: false },
                    { id: 203, t: 'Cierre de Cuentas', d: false }
                ],
                precursor: [
                    { id: 301, t: 'Clase de Servicio', d: false },
                    { id: 302, t: 'Revisión Horas', d: false },
                    { id: 303, t: 'Entrevista Prep.', d: false }
                ]
            }
        };

        function save() { localStorage.setItem(STORAGE_ID, JSON.stringify(state)); }

        function render() {
            const container = document.getElementById('task-list');
            const label = document.getElementById('tab-label');
            
            const config = {
                visit: { color: '#5ce875', txt: 'Pestaña: Visita' },
                assembly: { color: '#7ec8f5', txt: 'Pestaña: Asamblea' },
                precursor: { color: '#ffd060', txt: 'Pestaña: Precursores' }
            };

            const active = config[state.currentTab];
            label.innerText = active.txt;
            label.style.background = `${active.color}22`; // Color suave de fondo
            label.style.color = active.color;

            container.innerHTML = state.tasks[state.currentTab].map(task => `
                <div class="task-card ${task.d ? 'done' : ''}" 
                     style="border-left-color: ${task.d ? '#444' : active.color}"
                     onclick="toggleCheck(${task.id})">
                    <div class="check-box" style="background:${task.d ? active.color : 'transparent'}; border-color:${active.color}">
                        ${task.d ? '<span style="font-size:10px; color:#000;">✓</span>' : ''}
                    </div>
                    <div>${task.t}</div>
                </div>
            `).join('');
        }

        function toggleCheck(id) {
            const list = state.tasks[state.currentTab];
            const task = list.find(t => t.id === id);
            if(task) {
                task.d = !task.d;
                if (navigator.vibrate) navigator.vibrate(40);
                save(); render();
            }
        }

        function cycleTabs() {
            const order = ['visit', 'assembly', 'precursor'];
            let idx = order.indexOf(state.currentTab);
            state.currentTab = order[(idx + 1) % order.length];
            if (navigator.vibrate) navigator.vibrate(60);
            save(); render();
        }

        function showSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-screen').style.display = 'flex';
        }

        function updateClock() {
            const d = new Date();
            document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        setInterval(updateClock, 1000);
        updateClock();
        render();
    </script>
</body>
</html>
