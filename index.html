<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>CircuitoWatch 360</title>
<style>
/* ════════════════════════════════════════
   DISEÑO ORIGINAL DE BENJAMÍN (100% RESPETADO)
   Galaxy Watch 7 · Optimizado para Migrañas
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010; --b1:#0d1f42;
  --blue:#4da8f8;--blue2:#7ec8ff;--blue-d:rgba(30,95,168,0.7);
  --gold:#ffd060;--green:#5ce875;--red:#ff6060;--purple:#c084fc;
  --text:#e8f4ff;--dim:#6a8fb8;--dim2:#3a5a7a;
  --sz:432px;
}
html,body{
  width:100%;height:100%;max-width:var(--sz);max-height:var(--sz);
  overflow:hidden;background:var(--bg);
  font-family:'Segoe UI',Tahoma,sans-serif; color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background: radial-gradient(circle at center,transparent 83%,rgba(0,0,16,0.95) 100%);
}

/* CAROUSEL MASTER */
.car-wrap{overflow:hidden;width:100%;height:100%;}
.carousel{ display:flex;width:600%;height:100%; transition:transform .3s cubic-bezier(.4,0,.2,1); }
.page{ width:calc(100%/6);height:100%;flex-shrink:0; display:flex;flex-direction:column;align-items:center;justify-content:center; position:relative; }
.sz{ width:315px;display:flex;flex-direction:column;align-items:center; position:relative;z-index:1; }
.sz.scroll{overflow-y:auto;max-height:300px;padding-bottom:50px;}
.sz.scroll::-webkit-scrollbar{display:none;}

/* ESTILOS DE TEXTO */
.pg-h{ font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--dim);margin-bottom:10px; }
.h-cong{ font-size:16px;font-weight:700;text-align:center;margin:4px 0; text-shadow:0 0 15px rgba(77,168,248,0.3); }
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:220px;margin-top:8px;}
.stat{ background:rgba(255,255,255,0.05);border:1px solid rgba(77,168,248,0.2); border-radius:10px;padding:8px;text-align:center; }
.stat-v{font-size:22px;font-weight:bold;color:var(--blue);font-family:monospace;}
.stat-l{font-size:7px;color:var(--dim);text-transform:uppercase;}

/* CHECKLIST */
.chk-wrap{width:100%;padding:0 30px;}
.chk{ display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:5px; background:rgba(255,255,255,0.05);border-radius:12px; font-size:11px; border-left:4px solid var(--green); cursor:pointer;}
.chk-ring{ width:22px;height:22px;border-radius:50%; border:2px solid var(--green); display:flex;align-items:center;justify-content:center; }
.chk.done{opacity:0.2;text-decoration:line-through;}

/* CARDS DE DATOS */
.rc{ width:100%;padding:10px;border-radius:12px;margin-bottom:6px; border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03); }
.rc-row{display:flex;justify-content:space-between;align-items:center;}
.rc-nm{font-size:12px;font-weight:bold;}
.rc-hr{font-size:12px;color:var(--blue2);font-family:monospace;}

/* CRONÓMETRO */
.t-disp{ font-family:monospace;font-size:54px;font-weight:bold;color:var(--blue);margin-bottom:10px;}
.tb{ width:54px;height:54px;border-radius:50%;border:1px solid var(--blue); display:flex;align-items:center;justify-content:center; cursor:pointer; }

/* NAVEGACIÓN */
.nav-dots{ position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px; z-index:100; }
.dot{width:7px;height:7px;border-radius:50%;background:#333;}
.dot.on{background:var(--blue);width:16px;border-radius:3.5px;}

/* PANEL DE CARGA (SOLO CELULAR) */
#admin-panel {
    display: none; position: fixed; inset: 0; background: #000; z-index: 2000;
    flex-direction: column; align-items: center; padding: 40px 20px;
}
textarea { width: 100%; flex: 1; background: #111; border: 1px solid #333; color: #4da8f8; padding: 15px; border-radius: 15px; font-family: monospace; font-size: 12px; margin-bottom: 20px; outline: none; }
.btn-sync { width: 100%; background: #4da8f8; color: #000; font-weight: bold; padding: 20px; border-radius: 15px; border: none; font-size: 16px; }

#sync-tag{ position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:bold;z-index:1000;background:rgba(0,0,0,0.6);padding:2px 10px;border-radius:10px;color:var(--gold);}
#btn-open-admin { position: fixed; bottom: 40px; right: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1001; font-size: 20px; border: 1px solid #333; color: #555; }
</style>
</head>
<body>

<div id="sync-tag">BUSCANDO BUZÓN...</div>

<!-- PANEL OCULTO PARA EL CELULAR -->
<div id="admin-panel">
    <h2 style="margin-bottom: 10px; color: #fff;">Super Circuito 360</h2>
    <p style="color: #666; font-size: 13px; margin-bottom: 20px; text-align: center;">Pegue el texto JSON de su APK abajo para sincronizar con el reloj.</p>
    <textarea id="jsonInput" placeholder='Pegue aquí el contenido del archivo JSON...'></textarea>
    <button class="btn-sync" onclick="enviarDatos()">SINCRONIZAR AHORA</button>
    <button onclick="cerrarAdmin()" style="margin-top: 15px; background: none; border: none; color: #ff6060; font-weight: bold;">Cerrar</button>
</div>

<!-- BOTÓN PARA ABRIR PANEL (Se oculta en el reloj por tamaño) -->
<div id="btn-open-admin" onclick="abrirAdmin()">⚙</div>

<div class="car-wrap">
<div class="carousel" id="car">
  
  <!-- P0: HOME -->
  <div class="page" id="p0"><div class="sz">
    <div style="font-size:9px;color:var(--dim);letter-spacing:2px">HOY</div>
    <div class="h-cong" id="h-cong">Sin Datos</div>
    <div class="stat-g">
      <div class="stat"><div class="stat-v" id="s-eb">—</div><div class="stat-l">Prom EB</div></div>
      <div class="stat"><div class="stat-v" id="s-rp">—</div><div class="stat-l">Prom RP</div></div>
      <div class="stat"><div class="stat-v" id="s-cur" style="color:var(--blue2)">—</div><div class="stat-l">Cursos</div></div>
      <div class="stat"><div class="stat-v" id="s-pub" style="color:var(--green)">—</div><div class="stat-l">Pub.</div></div>
    </div>
  </div></div>

  <!-- P1: AGENDA -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--green)">✅ AGENDA DEL DÍA</div>
    <div class="chk-wrap" id="chk-wrap"></div>
  </div></div>

  <!-- P2: REUNIONES -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--purple)">🗓 REUNIONES</div>
    <div id="reu-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P3: COMIDAS -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--gold)">🍽 COMIDAS</div>
    <div id="com-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P4: PASTOREO -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--green)">🏠 PASTOREO</div>
    <div id="past-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P5: CRONÓMETRO -->
  <div class="page"><div class="sz">
    <div class="pg-h" style="color:var(--blue)">⏱ CRONÓMETRO</div>
    <div class="t-disp" id="t-disp">00:00</div>
    <div style="display:flex;gap:20px">
      <div class="tb" style="border-color:var(--green);color:var(--green)" onclick="tStart()">▶</div>
      <div class="tb" style="border-color:var(--red);color:var(--red)" onclick="tReset()">↺</div>
    </div>
  </div></div>

</div>
</div>

<div class="nav-dots" id="nav-dots"></div>

<script>
// --- EL "BUZÓN" DE BENJAMÍN ---
// Un identificador único para que solo tus dispositivos se hablen
const BUZON_KEY = "benjamin_360_v1_sync"; 

async function enviarDatos() {
    const jsonText = document.getElementById('jsonInput').value;
    if(!jsonText) return;
    try {
        JSON.parse(jsonText); // Validamos que sea JSON
        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${BUZON_KEY}`, {
            method: 'POST',
            body: jsonText
        });
        if(res.ok) {
            alert("¡Sincronizado con éxito! Mire su reloj.");
            cerrarAdmin();
            sync();
        }
    } catch(e) { alert("Error: El texto pegado no es válido."); }
}

async function sync() {
    try {
        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${BUZON_KEY}`);
        if(res.ok) {
            const data = await res.json();
            render(data.data || data);
            document.getElementById('sync-tag').innerText = "SINCRO OK";
            document.getElementById('sync-tag').style.color = "var(--green)";
        }
    } catch(e) { document.getElementById('sync-tag').innerText = "BUSCANDO..."; }
}

function render(d) {
    const cong = d.congregaciones[0];
    const v = (cong.visitas || []).slice(-1)[0];

    document.getElementById('h-cong').innerText = cong.nombre;
    document.getElementById('s-eb').innerText = (v.eb || [])[0] || '0';
    document.getElementById('s-rp').innerText = (v.rp || [])[0] || '0';
    document.getElementById('s-cur').innerText = (v.cursos || [])[0] || '0';
    document.getElementById('s-pub').innerText = (v.publicadores || [])[0] || '0';

    // Agenda
    const agenda = [];
    if(v.reu_vm_dia) agenda.push("⚡ VMC: " + v.reu_vm_hora);
    (v.pastoreo || []).forEach(p => agenda.push("🏠 " + p.familia));
    document.getElementById('chk-wrap').innerHTML = agenda.map(t => `<div class="chk" onclick="this.classList.toggle('done')"><div class="chk-ring">✓</div><span class="chk-txt">${t}</span></div>`).join('');

    // Reuniones
    document.getElementById('reu-wrap').innerHTML = `
        <div class="rc" style="border-color:var(--purple)"><div class="rc-row"><span class="rc-nm">VMC</span><span class="rc-hr">${v.reu_vm_hora||'—'}</span></div></div>
        <div class="rc" style="border-color:var(--blue)"><div class="rc-row"><span class="rc-nm">PÚBLICA</span><span class="rc-hr">${v.reu_rp_hora||'—'}</span></div></div>
    `;

    // Comidas
    document.getElementById('com-wrap').innerHTML = (v.comidas || []).map(c => `
        <div class="rc" style="border-color:var(--gold)"><div class="rc-row"><span class="rc-nm">${c.familia||'Hnos'}</span><span class="rc-hr">${c.hora||''}</span></div></div>
    `).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';

    // Pastoreo
    document.getElementById('past-wrap').innerHTML = (v.pastoreo || []).map(p => `
        <div class="rc" style="border-color:var(--green)"><div class="rc-row"><span class="rc-nm">${p.familia}</span><span class="rc-hr">${p.hora||''}</span></div></div>
    `).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';
}

// Lógica de UI Celular
function abrirAdmin() { document.getElementById('admin-panel').style.display = 'flex'; }
function cerrarAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
if(window.innerWidth < 400) document.getElementById('btn-open-admin').style.display = 'none';

// Navegación original
let cur=0; const PAGES=6;
function buildDots(){
    const c=document.getElementById('nav-dots'); c.innerHTML='';
    for(let i=0;i<PAGES;i++){
        const d=document.createElement('div');
        d.className='dot'+(i===0?' on':'');
        c.appendChild(d);
    }
}
buildDots();
document.body.addEventListener('click', (e) => {
    if(e.target.closest('.tb') || e.target.closest('.chk') || e.target.closest('#btn-open-admin')) return;
    cur = (cur + 1) % PAGES;
    document.getElementById('car').style.transform = `translateX(-${cur*(100/6)}%)`;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d,i) => d.classList.toggle('on', i === cur));
});

// Cronómetro original
let _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,1000); }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; document.getElementById('t-disp').textContent='00:00'; }
function tTick(){
    const s=Math.floor((Date.now()-_ts)/1000);
    const m=Math.floor(s/60),ss=s%60;
    document.getElementById('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

setInterval(sync, 15000); sync();
</script>
</body>
</html>
