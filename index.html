<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benjamín 360 - Flujo por Día</title>
    <style>
        /* CONFIGURACIÓN CRÍTICA: TAMAÑOS FIJOS PARA WATCH 7 */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: none; }
        
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        /* ANILLO SEGURO (310px) - DISEÑO COMPROBADO */
        .watch-shell {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 50px 32px 38px 32px; 
            background: radial-gradient(circle, #04081a 0%, #000 100%);
            position: relative; overflow: hidden;
            transition: border-color 0.8s ease;
        }

        /* CABECERA INTELIGENTE */
        .header { text-align: center; width: 100%; z-index: 10; }
        #clock { font-size: 28px; font-weight: bold; color: #7ec8f5; line-height: 1; }
        #cong-info { font-size: 11px; font-weight: bold; margin-top: 2px; text-transform: uppercase; color: #ffd060; }
        
        .status-pill { 
            display: inline-block; font-size: 10px; padding: 1px 10px; 
            border-radius: 8px; margin-top: 4px; font-weight: 800; color: #000;
        }

        /* FLUJO DIARIO (Reflejo exacto de CircuitoApp) */
        .unified-flow { 
            flex: 1; width: 100%; margin: 8px 0; 
            overflow-y: auto; scrollbar-width: none; z-index: 5;
        }
        .unified-flow::-webkit-scrollbar { display: none; }

        .task-card { 
            background: rgba(255,255,255,0.06); margin-bottom: 5px; 
            padding: 9px 12px; border-radius: 12px; font-size: 13px; 
            display: flex; align-items: center; gap: 8px;
            border-left: 4px solid #444; transition: all 0.3s ease;
        }
        .task-card.done { opacity: 0.2; text-decoration: line-through; border-left-color: #222 !important; }
        
        .day-label { font-size: 9px; opacity: 0.6; display: block; font-weight: bold; margin-bottom: 1px; }

        /* FOOTER */
        .footer { display: flex; gap: 30px; z-index: 10; margin-bottom: 5px; }
        .btn-action { 
            width: 42px; height: 42px; border-radius: 50%; 
            border: 1.5px solid #1e5fa8; color: white; background: rgba(30,95,168,0.2); 
            font-size: 20px; display: flex; align-items: center; justify-content: center;

            display: none; position: absolute; inset: 0;

</head>
<body>

    <div class="watch-shell" id="main-shell">
        <!-- HEADER -->
        <div class="header">
            <div id="clock">00:00</div>
            <div id="cong-info">SINCRONIZANDO...</div>
            <div id="week-pill" class="status-pill">ESPERE</div>
        </div>

        <!-- FLUJO INTELIGENTE POR DÍA -->
        <div class="unified-flow" id="main-flow">
            <!-- Cargado por JS según el día de la semana -->
        </div>

        <!-- ACCIONES -->
        <div class="footer">
            <button class="btn-action" onclick="showSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <button class="btn-action" onclick="location.reload()">🔄</button>
        </div>

        <!-- OVERLAY SOS -->
        <div id="sos-overlay" onclick="this.style.display='none'">
            <div style="font-size: 45px; color: #ff6060;">⚠</div>
            <div style="font-size: 18px; font-weight: bold;">CRISIS</div>
            <p style="font-size: 11px; opacity: 0.8; margin-top: 4px;">Aviso enviado</p>
        </div>
    </div>

    <script>
        /**
         * TABLA MAESTRA CON INTELIGENCIA POR DÍA
         * Días: 1: Lun, 2: Mar, 3: Mié, 4: Jue, 5: Vie, 6: Sáb, 0: Dom
         */
        const ITINERARIO = [
            { 
                start: '2026-04-20', 
                end: '2026-04-26', 
                cong: 'Cong. Centro', 
                type: 'visit',
                dailyTasks: {
                    2: [{t: 'Revisión Registros', s: 'APK'}, {t: 'Reunión Secretario', s: 'APK'}],
                    3: [{t: 'Reunión Ancianos', s: 'APK'}, {t: 'Pastoreo Fam. Glez', s: 'APK'}],
                    6: [{t: 'Salida al Campo', s: 'APK'}, {t: 'Reunión Precursores', s: 'APK'}],
                    0: [{t: 'Discurso Público', s: 'APK'}, {t: 'Examen Watchtower', s: 'APK'}]
                }
            },
            { 
                start: '2026-04-27', 
                end: '2026-05-03', 
                cong: 'Asamblea SC: Juan 4:24', 
                type: 'assembly',
                dailyTasks: {
                    6: [{t: 'Repaso Discurso', s: 'APK'}, {t: 'Logística Audio', s: 'APK'}],
                    0: [{t: 'Sesión Mañana', s: 'APK'}, {t: 'Sesión Tarde', s: 'APK'}]
                }
            }
        ];

        const STORAGE_KEY = 'benja_daily_intel_v1';
        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { doneIds: [] };

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

        function getActiveWeek() {
            const today = new Date();
            const todayClean = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const match = ITINERARIO.find(s => {
                const start = new Date(s.start.replace(/-/g, '\/'));
                const end = new Date(s.end.replace(/-/g, '\/'));
                return todayClean >= start && todayClean <= end;
            });
            return match || { type: 'visit', cong: 'Circuito 360', dailyTasks: {} };
        }

        function render() {
            const flow = document.getElementById('main-flow');
            const pill = document.getElementById('week-pill');
            const cong = document.getElementById('cong-info');
            const shell = document.getElementById('main-shell');
            
            const active = getActiveWeek();
            const today = new Date();
            const dayOfWeek = today.getDay(); // 0-6
            
            const config = {
                visit: { color: '#5ce875', label: 'VISITA' },
                assembly: { color: '#7ec8f5', label: 'ASAMBLEA' },
                precursor: { color: '#ffd060', label: 'PRECURSORES' }
            };

            const ui = config[active.type];
            cong.innerText = active.cong;
            pill.innerText = ui.label;
            pill.style.background = ui.color;
            shell.style.borderColor = ui.color;

            // Obtener tareas de hoy de la APK + Salud 360 fija
            const daily = active.dailyTasks[dayOfWeek] || [{t: 'Día de Viaje/Personal', s: 'Info'}];
            const health = [{t: 'Hidratación', s: '360'}, {t: 'Control Salud', s: '360'}];
            const allTasks = [...daily, ...health];

            flow.innerHTML = allTasks.map((task, idx) => {
                const uniqueId = `${active.cong}-${dayOfWeek}-${idx}`;
                const isDone = state.doneIds.includes(uniqueId);
                return `
                    <div class="task-card ${isDone ? 'done' : ''}" 
                         style="border-left-color: ${ui.color}"
                         onclick="toggleTask('${uniqueId}')">
                        <div style="flex:1">
                            <span class="day-label" style="color:${ui.color}">${task.s}</span>
                            <span>${task.t}</span>
                        </div>
                        <div style="width:14px; height:14px; border-radius:50%; border:1.5px solid ${ui.color}; background:${isDone ? ui.color : 'transparent'}"></div>
                    </div>
                `;
            }).join('');
        }

        function toggleTask(id) {
            if(state.doneIds.includes(id)) {
                state.doneIds = state.doneIds.filter(i => i !== id);
            } else {
                state.doneIds.push(id);
                if (navigator.vibrate) navigator.vibrate(40);
            }
            save(); render();
        }

        function showSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function updateClock() {
            const d = new Date();
            document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        setInterval(updateClock, 1000);
        updateClock();
        render();
    </script>
</body>
</html>
