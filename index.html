```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente 360 - Benjamín</title>
    <style>
        /* BLOQUEO DE ESCALA PARA PROTECCIÓN VISUAL */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: none; }
        
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: Arial, sans-serif; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }

        /* ANILLO AZUL FIJO (310px - Safe Zone para Watch 7) */
        .circulo-watch {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 50px 32px 42px 32px; 
            background: radial-gradient(circle, #04081a 0%, #000 100%);
            position: relative;
            overflow: hidden;
        }

        /* CABECERA: RELOJ Y CONGREGACIÓN */
        .cabecera { text-align: center; z-index: 2; }
        #hora { font-size: 30px; font-weight: bold; color: #7ec8f5; line-height: 1; }
        #congregacion { font-size: 13px; color: #ffd060; font-weight: bold; margin-top: 3px; text-transform: uppercase; }
        .pulso { font-size: 11px; color: #5ce875; margin-top: 2px; opacity: 0.9; }

        /* LISTA DE TAREAS (Scroll discreto) */
        .tareas { 
            flex: 1; width: 100%; margin: 10px 0; 
            overflow-y: auto; scrollbar-width: none; 
            z-index: 2;
        }
        .tareas::-webkit-scrollbar { display: none; }

        .item { 
            background: rgba(255,255,255,0.07); margin-bottom: 6px; 
            padding: 10px 12px; border-radius: 14px; font-size: 14px; 
            display: flex; align-items: center; gap: 10px;
            border-left: 4px solid #1e5fa8;
            transition: opacity 0.3s;
        }
        .item.listo { opacity: 0.2; text-decoration: line-through; border-left-color: #444; }

        /* BOTONES DE ACCIÓN */
        .botones { display: flex; gap: 28px; z-index: 2; }
        .btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1.5px solid #1e5fa8; color: white; background: rgba(30,95,168,0.2); 
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* PANTALLA SOS (MODO CRISIS - COLOR ANTIGLAME) */
        #sos-overlay { 
            display: none; position: absolute; inset: 0; 
            background: #2a0000; /* Rojo muy oscuro/bordó para evitar brillo excesivo */
            justify-content: center; align-items: center; flex-direction: column;
            border-radius: 50%; text-align: center; z-index: 10;
        }
        .sos-icon { font-size: 45px; color: #ff6060; margin-bottom: 8px; }
        .sos-txt { font-size: 18px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="circulo-watch" id="interfaz">
        <div class="cabecera">
            <div id="hora">00:00</div>
            <div id="congregacion">CONG. CENTRO</div>
            <div class="pulso">❤ <span id="bpm">72</span> BPM · ESTABLE</div>
        </div>

        <div class="tareas" id="lista-tareas">
            <!-- Tareas dinámicas -->
        </div>

        <div class="botones">
            <!-- Botón SOS con color suave para migrañas -->
            <button class="btn" onclick="activarSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <button class="btn" onclick="cambiarSemana()">⚙</button>
        </div>

        <!-- SOS OVERLAY ACTUALIZADO -->
        <div id="sos-overlay" onclick="this.style.display='none'">
            <div class="sos-icon">⚠</div>
            <div class="sos-txt">CRISIS</div>
            <p style="font-size: 12px; opacity: 0.7; margin-top: 5px;">Aviso enviado a Esperanza</p>
        </div>
    </div>

    <script>
        // PERSISTENCIA DE DATOS (Super Asistente 360)
        const STORAGE_KEY = 'asistente_360_benja_v2';
        let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            semana: 'visit', 
            congregacion: 'Cong. Centro',
            tareas: {
                visit: [
                    { id: 1, t: 'Revisión Registros', d: false },
                    { id: 2, t: 'Reunión Ancianos', d: false },
                    { id: 3, t: 'Salida Campo', d: false }
                ],
                assembly: [
                    { id: 4, t: 'Reunión Oradores', d: false },
                    { id: 5, t: 'Supervisión Audio', d: false }
                ],
                precursor: [
                    { id: 6, t: 'Revisión Informe', d: false },
                    { id: 7, t: 'Clase Precursores', d: false }
                ]
            }
        };

        function guardar() { localStorage.setItem(STORAGE_KEY, JSON.stringify(datos)); }

        function render() {
            const cont = document.getElementById('lista-tareas');
            const congEl = document.getElementById('congregacion');
            const colores = { visit: '#5ce875', assembly: '#7ec8f5', precursor: '#ffd060' };
            
            const colorActual = colores[datos.semana];
            congEl.innerText = datos.congregacion;
            congEl.style.color = colorActual;

            cont.innerHTML = datos.tareas[datos.semana].map(tarea => `
                <div class="item ${tarea.d ? 'listo' : ''}" 
                     style="border-left-color: ${tarea.d ? '#444' : colorActual}"
                     onclick="tildar(${tarea.id})">
                    <div style="width:14px; height:14px; border-radius:50%; border:2px solid ${colorActual}; background:${tarea.d ? colorActual : 'transparent'}"></div>
                    <div>${tarea.t}</div>
                </div>
            `).join('');
        }

        function tildar(id) {
            const t = datos.tareas[datos.semana].find(x => x.id === id);
            t.d = !t.d;
            if (navigator.vibrate) navigator.vibrate(50);
            guardar();
            render();
        }

        function activarSOS() {
            // Vibración discreta para el usuario
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function cambiarSemana() {
            const modos = ['visit', 'assembly', 'precursor'];
            let actual = modos.indexOf(datos.semana);
            datos.semana = modos[(actual + 1) % modos.length];
            guardar();
            render();
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function tick() {
            const d = new Date();
            document.getElementById('hora').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
            document.getElementById('bpm').innerText = 68 + Math.floor(Math.random() * 8);
        }

        setInterval(tick, 1000);
        tick();
        render();
    </script>
</body>
</html>
