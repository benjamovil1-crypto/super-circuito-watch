    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* CONFIGURACIÓN CRÍTICA: TAMAÑOS FIJOS PARA WATCH 7 */

        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;

            height: 100vh; overflow: hidden;

        .watch-shell {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;

<body>

    <div class="watch-shell" id="main-shell">
        <!-- HEADER -->
        <div class="header">
            <div id="clock">00:00</div>
            <div id="cong-info">SINCRONIZANDO...</div>
            <div id="week-pill" class="status-pill">ESPERE</div>
        </div>

        <!-- FLUJO DE TRABAJO -->
        <div class="unified-flow" id="main-flow">
            <!-- Inyectado por JS -->
        </div>

        <!-- ACCIONES -->
        <div class="footer">
            <button class="btn-action" onclick="showSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <button class="btn-action" onclick="location.reload()">🔄</button>
        </div>

        <!-- OVERLAY SOS -->
        <div id="sos-overlay" onclick="this.style.display='none'">
            <div style="font-size: 45px; color: #ff6060;">⚠</div>
            <div style="font-size: 20px; font-weight: bold;">CRISIS</div>
            <p style="font-size: 11px; opacity: 0.8; margin-top: 4px;">Aviso enviado</p>
        </div>
    </div>

    <script>
        // TABLA MAESTRA DE ITINERARIO (Espejo Interno de CircuitoApp)
        // Programado para abril y mayo de 2026
        const ITINERARIO = [
            { start: '2026-04-20', end: '2026-04-26', cong: 'Cong. Centro', type: 'visit' },
            { start: '2026-04-27', end: '2026-05-03', cong: 'Asamblea SC: Juan 4:24', type: 'assembly' },
            { start: '2026-05-04', end: '2026-05-10', cong: 'Cong. Norte', type: 'visit' },
            { start: '2026-05-11', end: '2026-05-17', cong: 'Escuela de Precursores', type: 'precursor' }
        ];

        const STORAGE_KEY = 'benja_mirror_final_v1';
        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { doneIds: [] };

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

        // Detecta automáticamente qué semana toca según la fecha del reloj
        function getActiveWeek() {
            const today = new Date();
            // Normalizar a medianoche para comparación limpia
            const todayClean = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const match = ITINERARIO.find(s => {
                const start = new Date(s.start.replace(/-/g, '\/'));
                const end = new Date(s.end.replace(/-/g, '\/'));
                return todayClean >= start && todayClean <= end;
            });
            // Si no hay fecha en tabla, queda en modo Visita General por defecto
            return match || { type: 'visit', cong: 'Circuito 360' };
        }

        // Tareas unificadas según el tipo de semana
        function getTasks(type) {
            const circuitTasks = {
                visit: ['Registros Congo', 'Reunión Ancianos', 'Salida al Campo', 'Pastoreo Familiar'],
                assembly: ['Reunión Oradores', 'Supervisión Audio', 'Informe Cuentas'],
                precursor: ['Clase Servicio', 'Revisión Informes', 'Entrevistas Prep.']
            };
            // Tareas fijas del Asistente 360 (Salud)
            const assistantTasks = ['Control Salud', 'Beber Agua'];
            
            return [
                ...circuitTasks[type].map(t => ({ t, src: 'CircuitoApp' })),
                ...assistantTasks.map(t => ({ t, src: '360' }))
            ];
        }

        function render() {
            const flow = document.getElementById('main-flow');
            const pill = document.getElementById('week-pill');
            const cong = document.getElementById('cong-info');
            const shell = document.getElementById('main-shell');
            
            const active = getActiveWeek();
            const config = {
                visit: { color: '#5ce875', label: 'SEMANA VISITA' },
                assembly: { color: '#7ec8f5', label: 'SEMANA ASAMBLEA' },
                precursor: { color: '#ffd060', label: 'PRECURSORES' }
            };

            const ui = config[active.type];
            cong.innerText = active.cong;
            pill.innerText = ui.label;
            pill.style.background = ui.color;
            shell.style.borderColor = ui.color; // El anillo cambia solo de color

            const tasks = getTasks(active.type);
            flow.innerHTML = tasks.map((task, idx) => {
                const uniqueId = `${active.type}-${idx}`;
                const isDone = state.doneIds.includes(uniqueId);
                return `
                    <div class="task-card ${isDone ? 'done' : ''}" 
                         style="border-left-color: ${ui.color}"
                         onclick="toggleTask('${uniqueId}')">
                        <div style="flex:1">
                            <span class="source-tag" style="color:${ui.color}">${task.src}</span>
                            <span>${task.t}</span>
                        </div>
                        <div style="width:14px; height:14px; border-radius:50%; border:1.5px solid ${ui.color}; background:${isDone ? ui.color : 'transparent'}"></div>
                    </div>
                `;
            }).join('');
        }

        function toggleTask(id) {
            if(state.doneIds.includes(id)) {
                state.doneIds = state.doneIds.filter(i => i !== id);
            } else {
                state.doneIds.push(id);
                if (navigator.vibrate) navigator.vibrate(40);
            }
            save(); render();
        }

        function showSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function updateClock() {
            const d = new Date();
            document.getElementById('clock').innerText = 
                d.getHours().toString().padStart(2,'0') + ':' + 
                d.getMinutes().toString().padStart(2,'0');
        }

        setInterval(updateClock, 1000);
        updateClock();
        render();
    </script>
</body>
</html>
