    <title>Asistente 360 - Benjamín</title>
    <style>
        /* BLOQUEO DE ESCALA PARA EVITAR QUE EL RELOJ DEFORME EL TEXTO */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: none; }
        
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: Arial, sans-serif; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }

        /* EL ANILLO AZUL (Safe Zone de 310px - No tocar esta medida) */
        .circulo-watch {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 48px 30px 42px 30px; 
            background: radial-gradient(circle, #04081a 0%, #000 100%);
            position: relative;
        }

        /* CABECERA: RELOJ Y CONGREGACIÓN */
        .cabecera { text-align: center; }
        #hora { font-size: 28px; font-weight: bold; color: #7ec8f5; line-height: 1; }

        .pulso { font-size: 11px; color: #5ce875; margin-top: 2px; opacity: 0.8; }

        /* LISTA DE TAREAS (Con Scroll Invisible) */
        .tareas { 
            flex: 1; width: 100%; margin: 8px 0; 
            overflow-y: auto; scrollbar-width: none; 
        }
        .tareas::-webkit-scrollbar { display: none; }

        .item { 
            background: rgba(255,255,255,0.08); margin-bottom: 5px; 
            padding: 9px 12px; border-radius: 12px; font-size: 13px; 
            display: flex; align-items: center; gap: 8px;
            border-left: 4px solid #1e5fa8;
        }
        .item.listo { opacity: 0.25; text-decoration: line-through; border-left-color: #444; }

        /* BOTONES DE ACCIÓN (SOS Y AJUSTES) */
        .botones { display: flex; gap: 25px; margin-top: 2px; }
        .btn { 
            width: 42px; height: 42px; border-radius: 50%; 
            border: 1.5px solid #1e5fa8; color: white; background: rgba(30,95,168,0.2); 
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* PANTALLA SOS (MODAL) */
        #sos-overlay { 
            display: none; position: fixed; inset: 0; background: #800; 
            justify-content: center; align-items: center; flex-direction: column;
            border-radius: 50%; text-align: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="circulo-watch" id="interfaz">
        <div class="cabecera">
            <div id="hora">00:00</div>
            <div id="congregacion">CARGANDO...</div>
            <div class="pulso">❤ <span id="bpm">72</span> BPM · OK</div>
        </div>

        <div class="tareas" id="lista-tareas">
            <!-- Tareas dinámicas -->
        </div>

        <div class="botones">
            <!-- Botón SOS (Crisis) -->
            <button class="btn" onclick="activarSOS()" style="color:#ff6060; border-color:#ff6060">⚠</button>
            <!-- Botón Configuración (Ciclo de Semanas) -->
            <button class="btn" onclick="cambiarSemana()">⚙</button>
        </div>
    </div>

    <!-- PANTALLA DE EMERGENCIA -->
    <div id="sos-overlay" onclick="this.style.display='none'">
        <div style="font-size: 40px;">⚠</div>
        <div style="font-size: 18px; font-weight: bold; margin-top: 5px;">AVISO CRISIS</div>
        <p style="font-size: 12px;">Esperanza alertada</p>
    </div>

    <script>
        // BASE DE DATOS LOCAL (Persistencia)
        const DB_KEY = 'benjamin_360_final';
        let datos = JSON.parse(localStorage.getItem(DB_KEY)) || {
            semana: 'visit', // visit, assembly, precursor
            congregacion: 'Cong. Centro',
            tareas: {
                visit: [
                    { id: 1, t: 'Revisión de Registros', d: false },
                    { id: 2, t: 'Reunión con Ancianos', d: false },
                    { id: 3, t: 'Salida al Campo', d: false }
                ],
                assembly: [
                    { id: 4, t: 'Reunión de Oradores', d: false },
                    { id: 5, t: 'Logística de Auditorio', d: false }
                ],
                precursor: [
                    { id: 6, t: 'Clase de Servicio', d: false },
                    { id: 7, t: 'Revisión de Horas', d: false }
                ]
            }
        };

        function guardar() { localStorage.setItem(DB_KEY, JSON.stringify(datos)); }

        function render() {
            const cont = document.getElementById('lista-tareas');
            const congEl = document.getElementById('congregacion');
            const colores = { visit: '#5ce875', assembly: '#7ec8f5', precursor: '#ffd060' };
            const etiquetas = { visit: 'Semana Visita', assembly: 'Asamblea', precursor: 'Precursores' };
            
            const colorActual = colores[datos.semana];
            congEl.innerText = datos.congregacion;
            congEl.style.color = colorActual;

            cont.innerHTML = datos.tareas[datos.semana].map(tarea => `
                <div class="item ${tarea.d ? 'listo' : ''}" 
                     style="border-left-color: ${tarea.d ? '#444' : colorActual}"
                     onclick="tildar(${tarea.id})">
                    <div style="width:12px; height:12px; border-radius:50%; border:2px solid ${colorActual}; background:${tarea.d ? colorActual : 'transparent'}"></div>
                    <div>${tarea.t}</div>
                </div>
            `).join('');
        }

        function tildar(id) {
            const t = datos.tareas[datos.semana].find(x => x.id === id);
            t.d = !t.d;
            if (navigator.vibrate) navigator.vibrate(40);
            guardar();
            render();
        }

        function activarSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function cambiarSemana() {
            const modos = ['visit', 'assembly', 'precursor'];
            let actual = modos.indexOf(datos.semana);
            datos.semana = modos[(actual + 1) % modos.length];
            guardar();
            render();
            if (navigator.vibrate) navigator.vibrate(60);
        }

        function tick() {
            const d = new Date();
            document.getElementById('hora').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
            document.getElementById('bpm').innerText = 68 + Math.floor(Math.random() * 10);
        }

        setInterval(tick, 1000);
        tick();
        render();
    </script>
</body>
</html>
