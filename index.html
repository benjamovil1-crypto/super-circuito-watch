<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>CircuitoWatch 360</title>
<style>
/* ════════════════════════════════════════
   DISEÑO ORIGINAL DE BENJAMÍN (INTEGRAL)
   Optimizado para Migrañas · Galaxy Watch 7
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010;
  --blue:#4da8f8;--blue2:#7ec8ff;--gold:#ffd060;--green:#5ce875;--red:#ff6060;--purple:#c084fc;
  --text:#e8f4ff;--dim:#6a8fb8;--dim2:#3a5a7a;
  --sz:432px;
}
html,body{
  width:100%;height:100%;max-width:var(--sz);max-height:var(--sz);
  overflow:hidden;background:var(--bg); font-family:sans-serif; color:var(--text);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background: radial-gradient(circle at center,transparent 83%,rgba(0,0,16,0.95) 100%);
}
.car-wrap{overflow:hidden;width:100%;height:100%;}
.carousel{ display:flex;width:600%;height:100%; transition:transform .3s ease; }
.page{ width:calc(100%/6);height:100%;flex-shrink:0; display:flex;flex-direction:column;align-items:center;justify-content:center; position:relative; }
.sz{ width:310px;display:flex;flex-direction:column;align-items:center; position:relative; }
.sz.scroll{overflow-y:auto;max-height:300px;padding-bottom:50px;}
.sz.scroll::-webkit-scrollbar{display:none;}

/* CABECERAS ORIGINALES */
.pg-h{ font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:10px;text-align:center;color:var(--dim); }
.h-cong{ font-size:16px;font-weight:700;text-align:center;line-height:1.2;margin:4px 0; }
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:220px;margin-top:10px;}
.stat{ background:rgba(255,255,255,0.05);border-radius:10px;padding:8px;text-align:center; border:1px solid rgba(77,168,248,0.2); }
.stat-v{font-size:22px;font-weight:bold;color:var(--blue);font-family:monospace;}
.stat-l{font-size:7px;color:var(--dim);text-transform:uppercase;}

/* CHECKLIST */
.chk-wrap{width:100%;padding:0 30px;}
.chk{ display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:5px; background:rgba(255,255,255,0.05);border-radius:12px; font-size:11px; border-left:4px solid var(--green); cursor:pointer;}
.chk.done{opacity:0.2;text-decoration:line-through;}

/* CRONÓMETRO */
.t-disp{ font-family:monospace;font-size:54px;font-weight:bold;color:var(--blue);margin-bottom:10px;}
.tb{ width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none;}

/* DOTS */
.nav-dots{ position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px; z-index:100; }
.dot{width:7px;height:7px;border-radius:50%;background:#333;}
.dot.on{background:var(--blue);width:16px;border-radius:3.5px;}

/* PANEL DE ADMINISTRACIÓN (SOLO CELULAR) */
#admin-panel {
    display: none; position: fixed; inset: 0; background: #000; z-index: 2000;
    flex-direction: column; padding: 20px; overflow-y: auto;
}
textarea { width: 100%; height: 250px; background: #111; border: 1px solid #333; color: #4da8f8; padding: 15px; border-radius: 15px; font-family: monospace; font-size: 11px; margin-bottom: 20px; }
.btn-sync { background: #4da8f8; color: #000; font-weight: bold; padding: 20px; border-radius: 15px; border: none; font-size: 16px; width: 100%; }

#sync-tag{ position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:bold;z-index:1000;background:rgba(0,0,0,0.6);padding:2px 10px;border-radius:10px;color:var(--gold);}
#open-admin { position: fixed; bottom: 45px; right: 45px; width: 45px; height: 45px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 1001; color: #555; }
</style>
</head>
<body>

<div id="sync-tag">INICIANDO...</div>

<div id="admin-panel">
    <h2 style="color: #fff; margin-bottom: 5px;">Sincronizador 360</h2>
    <p style="color: #666; font-size: 12px; margin-bottom: 20px;">Pegue el texto del JSON de su APK abajo:</p>
    <textarea id="jsonInput" placeholder='{"data": ... }'></textarea>
    <button class="btn-sync" id="btnSync" onclick="subirDatos()">SINCRONIZAR CON RELOJ</button>
    <button onclick="document.getElementById('admin-panel').style.display='none'" style="margin-top: 20px; background: none; border: none; color: #ff6060; width: 100%; font-weight: bold;">CERRAR PANEL</button>
</div>

<div id="open-admin" onclick="document.getElementById('admin-panel').style.display='flex'">⚙️</div>

<div class="car-wrap">
<div class="carousel" id="car">
  
  <!-- P0: HOME -->
  <div class="page" id="p0"><div class="sz">
    <div style="font-size:9px;color:var(--dim);letter-spacing:2px">HOY</div>
    <div class="h-cong" id="h-cong">Sin Datos</div>
    <div class="stat-g">
      <div class="stat"><div class="stat-v" id="s-eb">—</div><div class="stat-l">Prom EB</div></div>
      <div class="stat"><div class="stat-v" id="s-rp">—</div><div class="stat-l">Prom RP</div></div>
      <div class="stat"><div class="stat-v" id="s-cur" style="color:var(--blue2)">—</div><div class="stat-l">Cursos</div></div>
      <div class="stat"><div class="stat-v" id="s-pub" style="color:var(--green)">—</div><div class="stat-l">Pub.</div></div>
    </div>
  </div></div>

  <!-- P1: AGENDA -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--green)">✅ AGENDA DEL DÍA</div>
    <div class="chk-wrap" id="chk-list"></div>
  </div></div>

  <!-- P2: REUNIONES -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--purple)">🗓 REUNIONES</div>
    <div id="reu-list" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P3: COMIDAS -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--gold)">🍽 COMIDAS</div>
    <div id="com-list" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P4: PASTOREO -->
  <div class="page" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div class="pg-h" style="color:var(--green)">🏠 PASTOREO</div>
    <div id="past-list" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P5: CRONÓMETRO -->
  <div class="page"><div class="sz">
    <div class="pg-h" style="color:var(--blue)">⏱ CRONÓMETRO</div>
    <div class="t-disp" id="t-disp">00:00</div>
    <div style="display:flex;gap:20px">
      <div class="tb" style="background:#1a4a1a;color:var(--green)" onclick="tStart()">▶</div>
      <div class="tb" style="background:#4a0d0d;color:var(--red)" onclick="tReset()">↺</div>
    </div>
  </div></div>

</div>
</div>

<div class="nav-dots" id="nav-dots"></div>

<script>
// --- MOTOR DE SINCRONIZACIÓN BENJAMÍN ---
// Un buzón único para que el celular y el reloj se encuentren
const BUZON_KEY = "benjamin_360_master_final_v1";

async function subirDatos() {
    const input = document.getElementById('jsonInput');
    const btn = document.getElementById('btnSync');
    
    // 1. Limpieza de texto (Quitar espacios, comillas inteligentes, etc.)
    let raw = input.value.trim()
        .replace(/[\u201C\u201D]/g, '"') // Cambia comillas inteligentes por normales
        .replace(/[\u2018\u2019]/g, "'");

    if(!raw) return;

    try {
        const dataParsed = JSON.parse(raw); // Si esto falla, el JSON está mal
        btn.innerText = "SINCRONIZANDO...";
        btn.disabled = true;

        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${BUZON_KEY}`, {
            method: 'POST',
            body: JSON.stringify(dataParsed)
        });

        if(res.ok) {
            alert("¡ÉXITO! Datos enviados al reloj.");
            document.getElementById('admin-panel').style.display = 'none';
            descargarDelBuzon();
        }
    } catch(e) {
        alert("ERROR: El texto no es válido. Asegúrese de copiar TODO el contenido del archivo JSON desde el primer { hasta el último }.");
    } finally {
        btn.innerText = "SINCRONIZAR CON RELOJ";
        btn.disabled = false;
    }
}

async function descargarDelBuzon() {
    try {
        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${BUZON_KEY}`);
        if(res.ok) {
            const json = await res.json();
            render(json.data || json);
            document.getElementById('sync-tag').innerText = "SINCRO OK";
            document.getElementById('sync-tag').style.color = "var(--green)";
        }
    } catch(e) { document.getElementById('sync-tag').innerText = "BUSCANDO..."; }
}

function render(d) {
    const cong = d.congregaciones[0];
    const v = (cong.visitas || []).slice(-1)[0];

    document.getElementById('h-cong').innerText = cong.nombre;
    document.getElementById('s-eb').innerText = (v.eb || [])[0] || '0';
    document.getElementById('s-rp').innerText = (v.rp || [])[0] || '0';
    document.getElementById('s-cur').innerText = (v.cursos || [])[0] || '0';
    document.getElementById('s-pub').innerText = (v.publicadores || [])[0] || '0';

    // Agenda
    const agenda = [];
    if(v.reu_vm_dia) agenda.push("⚡ VMC: " + v.reu_vm_hora);
    (v.pastoreo || []).forEach(p => agenda.push("🏠 " + p.familia));
    document.getElementById('chk-list').innerHTML = agenda.map(t => `<div class="chk" onclick="this.classList.toggle('done')"><div class="chk-ring">✓</div><span class="chk-txt">${t}</span></div>`).join('');

    // Listas de Reuniones, Comidas y Pastoreo
    document.getElementById('reu-list').innerHTML = `
        <div class="rc" style="border-left:4px solid var(--purple)"><div class="rc-row"><span>VMC</span><span class="rc-hr">${v.reu_vm_hora||'—'}</span></div></div>
        <div class="rc" style="border-left:4px solid var(--blue)"><div class="rc-row"><span>PÚBLICA</span><span class="rc-hr">${v.reu_rp_hora||'—'}</span></div></div>
    `;
    document.getElementById('com-list').innerHTML = (v.comidas || []).map(c => `<div class="rc" style="border-left:4px solid var(--gold)"><div class="rc-row"><span>${c.familia}</span><span class="rc-hr">${c.hora||''}</span></div></div>`).join('') || '<p style="text-align:center;font-size:10px;color:#444">Sin datos</p>';
    document.getElementById('past-list').innerHTML = (v.pastoreo || []).map(p => `<div class="rc" style="border-left:4px solid var(--green)"><div class="rc-row"><span>${p.familia}</span><span class="rc-hr">${p.hora||''}</span></div></div>`).join('') || '<p style="text-align:center;font-size:10px;color:#444">Sin datos</p>';
}

// Interfaz
if(window.innerWidth > 500) document.getElementById('open-admin').style.display = 'flex';

// Navegación original
let cur=0; const PAGES=6;
function buildDots(){
    const c=document.getElementById('nav-dots'); c.innerHTML='';
    for(let i=0;i<PAGES;i++){
        const d=document.createElement('div');
        d.className='dot'+(i===0?' on':'');
        c.appendChild(d);
    }
}
buildDots();
document.body.addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON' || e.target.closest('.chk') || e.target.id === 'open-admin') return;
    cur = (cur + 1) % PAGES;
    document.getElementById('car').style.transform = `translateX(-${cur*(100/6)}%)`;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d,i) => d.classList.toggle('on', i === cur));
});

// Cronómetro original
let _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,1000); }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; document.getElementById('t-disp').textContent='00:00'; }
function tTick(){
    const s=Math.floor((Date.now()-_ts)/1000);
    const m=Math.floor(s/60),ss=s%60;
    document.getElementById('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

setInterval(descargarDelBuzon, 30000); descargarDelBuzon();
</script>
</body>
</html>
