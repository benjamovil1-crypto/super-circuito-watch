```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>CircuitoWatch 360</title>
<style>
/* ════════════════════════════════════════
   TU DISEÑO ORIGINAL (INTEGRAL 100%)
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010; --b1:#0d1f42;
  --blue:#4da8f8;--blue2:#7ec8ff;--blue-d:rgba(30,95,168,0.7);
  --gold:#ffd060;--green:#5ce875;--red:#ff6060;--purple:#c084fc;
  --text:#e8f4ff;--dim:#6a8fb8;--dim2:#3a5a7a;
  --sz:432px;--half:216px;
}
html,body{ width:100%;height:100%;max-width:var(--sz);max-height:var(--sz); overflow:hidden;background:var(--bg); font-family:sans-serif; color:var(--text); }
body::after{ content:'';position:fixed;inset:0;pointer-events:none;z-index:999; background: radial-gradient(circle at center,transparent 83%,rgba(0,0,16,0.95) 100%); }
.car-wrap{overflow:hidden;width:100%;height:100%;}
.carousel{ display:flex;width:600%;height:100%; transition:transform .3s ease; }
.page{ width:calc(100%/6);height:100%;flex-shrink:0; display:flex;flex-direction:column;align-items:center;justify-content:center; position:relative; }
.sz{ width:315px;display:flex;flex-direction:column;align-items:center; }
.sz.scroll{overflow-y:auto;max-height:300px;padding-bottom:50px;}
.sz.scroll::-webkit-scrollbar{display:none;}

.h-cong{ font-size:16px;font-weight:700;text-align:center;margin:4px 0; }
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:220px;margin-top:10px;}
.stat{ background:rgba(255,255,255,0.05);border:1px solid rgba(77,168,248,0.2); border-radius:10px;padding:8px;text-align:center; }
.stat-v{font-size:22px;font-weight:bold;color:var(--blue);font-family:monospace;}
.stat-l{font-size:8px;color:var(--dim);text-transform:uppercase;}

.chk-wrap{width:100%;padding:0 30px;}
.chk{ display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:5px; background:rgba(255,255,255,0.05);border-radius:12px; font-size:11px; border-left:4px solid var(--green); }
.chk-ring{ width:22px;height:22px;border-radius:50%; border:2px solid var(--green); display:flex;align-items:center;justify-content:center; }
.chk.done{opacity:0.2;text-decoration:line-through;}

.rc{ width:100%;padding:10px;border-radius:12px;margin-bottom:6px; border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03); }
.rc-row{display:flex;justify-content:space-between;align-items:center;}
.rc-nm{font-size:12px;font-weight:bold;}
.rc-hr{font-size:12px;color:var(--blue2);font-family:monospace;}

.t-disp{ font-family:monospace;font-size:54px;font-weight:bold;color:var(--blue);margin-bottom:10px;}
.tb{ width:50px;height:50px;border-radius:50%;border:1px solid var(--blue); display:flex;align-items:center;justify-content:center; }

.nav-dots{ position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px; }
.dot{width:7px;height:7px;border-radius:50%;background:#333;}
.dot.on{background:var(--blue);width:16px;border-radius:3.5px;}

#status-tag{ position:fixed;top:40px;font-size:8px;font-weight:bold;z-index:1000;color:var(--gold);background:rgba(0,0,0,0.6);padding:2px 10px;border-radius:10px;}
</style>
</head>
<body>

<div id="status-tag">BUSCANDO BUZÓN...</div>

<div class="car-wrap">
<div class="carousel" id="car">
  
  <!-- P0: HOME -->
  <div class="page" id="p0"><div class="sz">
    <div style="font-size:9px;color:var(--dim);letter-spacing:2px">HOY</div>
    <div class="h-cong" id="h-cong">Sin datos</div>
    <div class="stat-g">
      <div class="stat"><div class="stat-v" id="s-eb">—</div><div class="stat-l">Prom EB</div></div>
      <div class="stat"><div class="stat-v" id="s-rp">—</div><div class="stat-l">Prom RP</div></div>
      <div class="stat"><div class="stat-v" id="s-cur" style="color:var(--blue2)">—</div><div class="stat-l">Cursos</div></div>
      <div class="stat"><div class="stat-v" id="s-pub" style="color:var(--green)">—</div><div class="stat-l">Pub.</div></div>
    </div>
  </div></div>

  <!-- P1: AGENDA -->
  <div class="page" id="p1" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div style="font-size:9px;color:var(--green);font-weight:bold;margin-bottom:12px;letter-spacing:1px">✅ AGENDA DEL DÍA</div>
    <div class="chk-wrap" id="chk-wrap"></div>
  </div></div>

  <!-- P2: REUNIONES -->
  <div class="page" id="p2" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div style="font-size:9px;color:var(--purple);font-weight:bold;margin-bottom:12px">🗓 REUNIONES</div>
    <div id="reu-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P3: COMIDAS -->
  <div class="page" id="p3" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div style="font-size:9px;color:var(--gold);font-weight:bold;margin-bottom:12px">🍽 COMIDAS</div>
    <div id="com-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P4: PASTOREO -->
  <div class="page" id="p4" style="justify-content:flex-start;padding-top:60px"><div class="sz scroll">
    <div style="font-size:9px;color:var(--green);font-weight:bold;margin-bottom:12px">🏠 PASTOREO</div>
    <div id="past-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <!-- P5: CRONÓMETRO -->
  <div class="page" id="p5"><div class="sz">
    <div class="t-disp" id="t-disp">00:00</div>
    <div style="display:flex;gap:20px">
      <div class="tb" style="border-color:var(--green);color:var(--green)" onclick="tStart()">▶</div>
      <div class="tb" style="border-color:var(--red);color:var(--red)" onclick="tReset()">↺</div>
    </div>
  </div></div>

</div>
</div>

<div class="nav-dots" id="nav-dots"></div>

<script>
// --- MOTOR DE SINCRONIZACIÓN ---
const MY_KEY = "benjamin_360_master_sync";
const statusTag = document.getElementById('status-tag');

function sync() {
    // Usamos XMLHttpRequest para máxima compatibilidad con el reloj
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/" + MY_KEY, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try {
                var json = JSON.parse(xhr.responseText);
                render(json.data || json);
                statusTag.innerText = "SINCRO OK";
                statusTag.style.color = "var(--green)";
            } catch(e) { statusTag.innerText = "ERROR DATOS"; }
        }
    };
    xhr.send();
}

function render(d) {
    var cong = d.congregaciones[0];
    var v = (cong.visitas || []).slice(-1)[0];

    document.getElementById('h-cong').innerText = cong.nombre;
    document.getElementById('s-eb').innerText = (v.eb || [])[0] || '0';
    document.getElementById('s-rp').innerText = (v.rp || [])[0] || '0';
    document.getElementById('s-cur').innerText = (v.cursos || [])[0] || '0';
    document.getElementById('s-pub').innerText = (v.publicadores || [])[0] || '0';

    // Agenda
    var agenda = [];
    if(v.reu_vm_dia) agenda.push("⚡ VMC: " + v.reu_vm_hora);
    (v.pastoreo || []).forEach(function(p){ agenda.push("🏠 " + p.familia); });
    document.getElementById('chk-wrap').innerHTML = agenda.map(function(t){
        return '<div class="chk" onclick="this.classList.toggle(\'done\')"><div class="chk-ring">✓</div><span class="chk-txt">'+t+'</span></div>';
    }).join('');

    // Reuniones
    document.getElementById('reu-wrap').innerHTML = 
        '<div class="rc" style="border-color:var(--purple)"><div class="rc-row"><span class="rc-nm">VMC</span><span class="rc-hr">'+(v.reu_vm_hora||'—')+'</span></div></div>' +
        '<div class="rc" style="border-color:var(--blue)"><div class="rc-row"><span class="rc-nm">PÚBLICA</span><span class="rc-hr">'+(v.reu_rp_hora||'—')+'</span></div></div>';

    // Comidas
    document.getElementById('com-wrap').innerHTML = (v.comidas || []).map(function(c){
        return '<div class="rc" style="border-color:var(--gold)"><div class="rc-row"><span class="rc-nm">'+(c.familia||'Hnos')+'</span><span class="rc-hr">'+(c.hora||'')+'</span></div></div>';
    }).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';

    // Pastoreo
    document.getElementById('past-wrap').innerHTML = (v.pastoreo || []).map(function(p){
        return '<div class="rc" style="border-color:var(--green)"><div class="rc-row"><span class="rc-nm">'+p.familia+'</span><span class="rc-hr">'+(p.hora||'')+'</span></div></div>';
    }).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';
}

// Navegación
var cur=0; var PAGES=6;
function buildDots(){
    var c=document.getElementById('nav-dots'); c.innerHTML='';
    for(var i=0;i<PAGES;i++){
        var d=document.createElement('div');
        d.className='dot'+(i===0?' on':'');
        c.appendChild(d);
    }
}
buildDots();
document.body.addEventListener('click', function(e){
    if(e.target.closest('.tb') || e.target.closest('.chk')) return;
    cur = (cur + 1) % PAGES;
    document.getElementById('car').style.transform = 'translateX(-'+(cur*(100/6))+'%)';
    var dots = document.querySelectorAll('.dot');
    for(var i=0; i<dots.length; i++){ dots[i].classList.toggle('on', i === cur); }
});

// Cronómetro original
var _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,1000); }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; document.getElementById('t-disp').textContent='00:00'; }
function tTick(){
    var s=Math.floor((Date.now()-_ts)/1000);
    var m=Math.floor(s/60),ss=s%60;
    document.getElementById('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

setInterval(sync, 15000); // Sincroniza cada 15 seg
sync();
</script>
</body>
</html>
