<!DOCTYPE html>

<!-- FIREBASE COMPAT - Único método que el navegador del Watch 7 entiende -->
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>

<style>
/* ════════════════════════════════════════
   DISEÑO ORIGINAL DE BENJAMÍN (100% RESPETADO)
   Galaxy Watch 7 · 432 × 432 px
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010;
  --b1:#0d1f42;
  --blue:#4da8f8;--blue2:#7ec8ff;--blue-d:rgba(30,95,168,0.7);
  --gold:#ffd060;--green:#5ce875;--red:#ff6060;--purple:#c084fc;
  --text:#e8f4ff;--dim:#6a8fb8;--dim2:#3a5a7a;
  --sz:432px;--half:216px;
}

html,body{
  width:100%;height:100%;max-width:var(--sz);max-height:var(--sz);
  overflow:hidden;background:var(--bg);
  font-family:'Segoe UI',Tahoma,sans-serif;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

/* Máscara Circular para Watch 7 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background: 
    radial-gradient(circle at center,transparent 83%,rgba(0,0,16,0.95) 100%),
    radial-gradient(circle at center,transparent 90%,#000010 100%);
}

.car-wrap{overflow:hidden;width:100%;height:100%;}
.carousel{
  display:flex;width:600%;height:100%;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.page{
  width:calc(100%/6);height:100%;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.sz{ width:320px;display:flex;flex-direction:column;align-items:center; position:relative;z-index:1; }
.sz.scroll{overflow-y:auto;max-height:305px;padding-bottom:50px;}
.sz.scroll::-webkit-scrollbar{display:none;}

/* CABECERAS ORIGINALES */
.pg-h{ font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700; color:var(--dim);margin-bottom:10px;text-align:center; }
.h-date{font-size:9.5px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:2px;}
.h-cong{
  font-size:15px;font-weight:700;color:#fff;text-align:center;
  line-height:1.22;margin:3px 0 1px;max-width:215px;
  text-shadow:0 0 22px rgba(77,168,248,0.4);
}
.h-city{font-size:9px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}

/* ESTADÍSTICAS */
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:205px;}
.stat{
  background:rgba(255,255,255,0.04);border:1px solid rgba(77,168,248,0.15);
  border-radius:9px;padding:7px 4px;text-align:center;
}
.stat-v{font-size:22px;font-weight:700;font-family:monospace;color:var(--blue);}
.stat-l{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}

/* CHECKLIST */
.chk-wrap{width:100%;padding:0 34px;}
.chk{
  display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:4px;
  border-radius:10px;background:rgba(255,255,255,0.035);
  border:1px solid rgba(92,232,117,0.1); cursor:pointer;
}
.chk.done{ background:rgba(92,232,117,0.07); opacity:0.4; }
.chk-ring{
  width:24px;height:24px;border-radius:50%; border:2px solid rgba(92,232,117,0.4);
  display:flex;align-items:center;justify-content:center;
}
.chk.done .chk-ring{ background:var(--green); border-color:var(--green); color:#000; }

/* REUNIONES / COMIDAS / VISITAS */
.rc{ width:100%;padding:10px;border-radius:12px;margin-bottom:6px; border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03); }
.rc-row{display:flex;justify-content:space-between;align-items:center;}
.rc-nm{font-size:12px;font-weight:bold;}
.rc-hr{font-size:12px;color:var(--blue2);font-family:monospace;}

/* CRONÓMETRO */
.t-disp{ font-family:monospace;font-size:54px;font-weight:700; color:var(--blue);letter-spacing:5px;line-height:1; margin-bottom:10px; }
.tb{ width:54px;height:54px;border-radius:50%;border:none; cursor:pointer;font-size:20px; display:flex;align-items:center;justify-content:center; }
.tb-go{background:linear-gradient(135deg,#1a7a3a,#0a4a1a);border:2px solid rgba(92,232,117,0.25);color:white;}
.tb-rs{background:linear-gradient(135deg,#7a1e1e,#4a0d0d);border:2px solid rgba(255,96,96,0.2);color:white;}

/* PANEL DE CONTROL (PARA EL CELULAR) */
#admin-overlay {
  display:none; position:fixed; inset:0; background:#000; z-index:2000;
  flex-direction:column; padding:20px; overflow-y:auto;
}
textarea { width:100%; height:250px; background:#111; border:1px solid #333; color:var(--blue); padding:15px; border-radius:15px; font-family:monospace; font-size:12px; margin-bottom:15px; }
.btn-save { width:100%; background:var(--blue); color:#000; font-weight:bold; padding:20px; border-radius:15px; border:none; }
.btn-admin-trigger { display:none; margin-top:15px; background:rgba(255,255,255,0.05); border:1px solid #333; color:var(--dim); padding:8px 15px; border-radius:20px; font-size:10px; }

#sync-indicator { position:fixed; top:40px; left:50%; transform:translateX(-50%); font-size:8px; font-weight:bold; z-index:1001; padding:2px 10px; border-radius:10px; background:rgba(0,0,0,0.6); }
</style>
</head>
<body>

<div id="sync-indicator" style="color:var(--gold)">CONECTANDO NUBE...</div>

<!-- PANEL QUE SE ABRE EN EL S24 ULTRA -->
<div id="admin-overlay">
  <h2 style="color:#fff; margin-bottom:10px">Super Asistente 360</h2>
  <p style="color:#666; font-size:12px; margin-bottom:15px">Pegue el contenido del JSON de su APK abajo:</p>
  <textarea id="json-input" placeholder='{"data": ... }'></textarea>
  <button id="btn-sync-action" class="btn-save" onclick="subirDatos()">SINCRONIZAR CON RELOJ</button>
  <button onclick="document.getElementById('admin-overlay').style.display='none'" style="margin-top:20px; background:none; border:none; color:red; font-weight:bold">CERRAR</button>
</div>

<div class="car-wrap">
<div class="carousel" id="car">

  <!-- P0: HOME -->
  <div class="page" id="p0">
    <div class="sz">
      <div class="h-date">Superintendente</div>
      <div class="h-cong" id="h-cong">Sin Datos</div>
      <div class="h-city" id="h-city">Conectando...</div>
      <div class="stat-g">
        <div class="stat"><div class="stat-v" id="s-eb">0</div><div class="stat-l">Prom EB</div></div>
        <div class="stat"><div class="stat-v" id="s-rp">0</div><div class="stat-l">Prom RP</div></div>
        <div class="stat"><div class="stat-v" id="s-cur" style="color:var(--blue2)">0</div><div class="stat-l">Cursos</div></div>
        <div class="stat"><div class="stat-v" id="s-pub" style="color:var(--green)">0</div><div class="stat-l">Pub.</div></div>
      </div>
      <button id="btn-config" class="btn-admin-trigger" onclick="document.getElementById('admin-overlay').style.display='flex'">⚙️ PANEL DE CARGA</button>
    </div>
  </div>

  <!-- P1: AGENDA -->
  <div class="page" style="justify-content:flex-start;padding-top:48px">
    <div class="sz scroll">
      <div class="pg-h green">✅ AGENDA DEL DÍA</div>
      <div id="chk-wrap" class="chk-wrap"></div>
    </div>
  </div>

  <!-- P2, P3, P4, P5 Mantenidos igual que tu original -->
  <div class="page" style="justify-content:flex-start;padding-top:48px"><div class="sz scroll">
    <div class="pg-h purple">🗓 REUNIONES</div>
    <div id="reu-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <div class="page" style="justify-content:flex-start;padding-top:48px"><div class="sz scroll">
    <div class="pg-h gold">🍽 COMIDAS</div>
    <div id="com-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <div class="page" style="justify-content:flex-start;padding-top:48px"><div class="sz scroll">
    <div class="pg-h green">🏠 PASTOREO</div>
    <div id="past-wrap" style="width:100%;padding:0 30px"></div>
  </div></div>

  <div class="page" id="p5">
    <div class="sz">
      <div class="pg-h blue">⏱ CRONÓMETRO</div>
      <div class="t-disp" id="t-disp">00:00</div>
      <div class="t-btns" style="display:flex;gap:20px">
        <div class="tb tb-go" onclick="tStart()">▶</div>
        <div class="tb tb-rs" onclick="tReset()">↺</div>
      </div>
    </div>
  </div>

</div>
</div>

<div class="nav-dots" id="nav-dots"></div>

<script>
// --- LÓGICA DE NUBE AUTOMÁTICA ---
const firebaseConfig = JSON.parse(__firebase_config);
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const appId = typeof __app_id !== 'undefined' ? __app_id : 'benjamin-360';

// 1. Conexión y Escucha
firebase.auth().signInAnonymously().then(() => {
    document.getElementById('sync-indicator').innerText = "CONECTADO";
    document.getElementById('sync-indicator').style.color = "var(--green)";

    // Escuchar cambios en tiempo real
    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerario').doc('actual')
    .onSnapshot(doc => {
        if(doc.exists) {
            renderUI(doc.data().data);
        }
    });
});

// 2. Función para Subir Datos (S24 Ultra)
async function subirDatos() {
    const raw = document.getElementById('json-input').value.trim();
    if(!raw) return;

    const btn = document.getElementById('btn-sync-action');
    btn.innerText = "SUBIENDO...";
    btn.disabled = true;

    try {
        const jsonData = JSON.parse(raw);
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerario').doc('actual').set({
            data: jsonData,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("¡Sincronización Exitosa!");
        document.getElementById('admin-overlay').style.display = 'none';
    } catch(e) {
        alert("Error: El texto no es un JSON válido. Asegúrese de copiar todo el texto del archivo.");
    } finally {
        btn.innerText = "SINCRONIZAR CON RELOJ";
        btn.disabled = false;
    }
}

function renderUI(d) {
    const data = d.data || d;
    const cong = data.congregaciones[0];
    const visit = (cong.visitas || []).slice(-1)[0];

    document.getElementById('h-cong').innerText = cong.nombre;
    document.getElementById('h-city').innerText = cong.ciudad || 'Circuito Activo';
    document.getElementById('s-eb').innerText = (visit.eb || [])[0] || '0';
    document.getElementById('s-rp').innerText = (visit.rp || [])[0] || '0';
    document.getElementById('s-cur').innerText = (visit.cursos || [])[0] || '0';
    document.getElementById('s-pub').innerText = (visit.publicadores || [])[0] || '0';

    // Agenda
    const agenda = [];
    if(visit.reu_vm_dia) agenda.push("⚡ VMC: " + visit.reu_vm_hora);
    (visit.pastoreo || []).forEach(p => agenda.push("🏠 " + p.familia));
    document.getElementById('chk-wrap').innerHTML = agenda.map(t => `<div class="chk" onclick="this.classList.toggle('done')"><div class="chk-ring">✓</div><span class="chk-txt">${t}</span></div>`).join('');

    // Reuniones, Comidas, Pastoreo (Tu lógica original restaurada)
    document.getElementById('reu-wrap').innerHTML = `
        <div class="rc" style="border-left:4px solid var(--purple)"><div class="rc-row"><span>VMC</span><span class="rc-hr">${visit.reu_vm_hora||'—'}</span></div></div>
        <div class="rc" style="border-left:4px solid var(--blue)"><div class="rc-row"><span>PÚBLICA</span><span class="rc-hr">${visit.reu_rp_hora||'—'}</span></div></div>
    `;
}

// Mostrar botón de carga solo en el celular
if(window.innerWidth > 500) {
    document.getElementById('btn-config').style.display = 'block';
}

// --- TU LÓGICA DE NAVEGACIÓN Y CRONÓMETRO ORIGINALES (SIN CAMBIOS) ---
let cur = 0; const PAGES = 6;
function buildDots(){
    const c=document.getElementById('nav-dots'); c.innerHTML='';
    for(let i=0;i<PAGES;i++){
        const d=document.createElement('div');
        d.className='dot'+(i===0?' on':'');
        c.appendChild(d);
    }
}
function goTo(n){
    cur = n;
    document.getElementById('car').style.transform = `translateX(-${cur*(100/6)}%)`;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d,i) => d.classList.toggle('on', i === cur));
}
buildDots();
document.body.addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON' || e.target.closest('.chk')) return;
    cur = (cur + 1) % PAGES; goTo(cur);
});

let _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,1000); }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; document.getElementById('t-disp').textContent='00:00'; }
function tTick(){
    const s=Math.floor((Date.now()-_ts)/1000);
    const m=Math.floor(s/60),ss=s%60;
    document.getElementById('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}
</script>
</body>
</html>
