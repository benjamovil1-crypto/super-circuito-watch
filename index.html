<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* BLOQUEO DE ESCALA PARA EVITAR QUE EL RELOJ DEFORME EL TEXTO */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: none; }
        
        body { 
            background: #000; color: #fff; margin: 0; 
            font-family: Arial, sans-serif; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }

        /* EL ANILLO AZUL FIJO (310px - Safe Zone para Watch 7) */
        .circulo-watch {
            width: 310px; height: 310px; border-radius: 50%;
            border: 2px solid #1e5fa8; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 50px 35px 45px 35px; 
            background: radial-gradient(circle, #04081a 0%, #000 100%);
            position: relative;
        }

        /* CABECERA: RELOJ Y CONGREGACIÓN */
        .header { text-align: center; }
        #hora { font-size: 28px; font-weight: bold; color: #7ec8f5; line-height: 1; }
        #label-semana { font-size: 12px; font-weight: bold; margin-top: 3px; text-transform: uppercase; }

        /* LISTA DE TAREAS (DISEÑO SIMPLE) */
        .tareas { 
            flex: 1; width: 100%; margin: 10px 0; 
            overflow-y: auto; scrollbar-width: none; 
        }
        .tareas::-webkit-scrollbar { display: none; }

        .item { 
            background: rgba(255,255,255,0.08); margin-bottom: 6px; 
            padding: 9px 12px; border-radius: 12px; font-size: 14px; 
            display: flex; align-items: center; gap: 10px;
            border-left: 4px solid #1e5fa8;
        }
        .item.listo { opacity: 0.2; text-decoration: line-through; border-left-color: #444; }

        /* BOTONES DE ACCIÓN */
        .footer { display: flex; gap: 25px; }
        .btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1.5px solid #1e5fa8; color: white; background: rgba(30,95,168,0.2); 
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* SOS OVERLAY (BORDÓ PROFUNDO ANTIGLANE) */
        #sos-overlay { 
            display: none; position: absolute; inset: 0; 
            background: #2a0000; justify-content: center; 
            align-items: center; flex-direction: column;
            border-radius: 50%; text-align: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="circulo-watch">
        <div class="header">
            <div id="hora">00:00</div>
            <div id="label-semana">CARGANDO...</div>
        </div>

        <div class="tareas" id="lista-tareas">
            <!-- Tareas dinámicas -->
        </div>

        <div class="footer">
            <button class="btn" onclick="activarSOS()" style="color:#ff8080; border-color:#602020">⚠</button>
            <button class="btn" onclick="cicloSemana()">⚙</button>
        </div>

        <!-- SOS OVERLAY -->
        <div id="sos-overlay" onclick="this.style.display='none'">
            <div style="font-size: 40px; color: #ff6060;">⚠</div>
            <div style="font-size: 18px; font-weight: bold;">CRISIS</div>
            <p style="font-size: 11px; opacity: 0.7; margin-top: 4px;">Esperanza alertada</p>
        </div>
    </div>

    <script>
        // PERSISTENCIA DE DATOS
        const DB_KEY = 'benjamin_360_estable_v3';
        let datos = JSON.parse(localStorage.getItem(DB_KEY)) || {
            modo: 'visit', // visit, assembly, precursor
            tareas: [
                { id: 1, t: 'Registros Congo', d: false },
                { id: 2, t: 'Reunión Ancianos', d: false },
                { id: 3, t: 'Salida al Campo', d: false }
            ]
        };

        function guardar() { localStorage.setItem(DB_KEY, JSON.stringify(datos)); }

        function render() {
            const cont = document.getElementById('lista-tareas');
            const label = document.getElementById('label-semana');
            
            const colores = { visit: '#5ce875', assembly: '#7ec8f5', precursor: '#ffd060' };
            const nombres = { visit: 'VISITA', assembly: 'ASAMBLEA', precursor: 'PRECURSORES' };
            
            const colorActual = colores[datos.modo];
            label.innerText = nombres[datos.modo];
            label.style.color = colorActual;

            cont.innerHTML = datos.tareas.map(tarea => `
                <div class="item ${tarea.d ? 'listo' : ''}" 
                     style="border-left-color: ${tarea.d ? '#444' : colorActual}"
                     onclick="tildar(${tarea.id})">
                    <div style="width:12px; height:12px; border-radius:50%; border:2px solid ${colorActual}; background:${tarea.d ? colorActual : 'transparent'}"></div>
                    <div>${tarea.t}</div>
                </div>
            `).join('');
        }

        function tildar(id) {
            const t = datos.tareas.find(x => x.id === id);
            t.d = !t.d;
            if (navigator.vibrate) navigator.vibrate(40);
            guardar();
            render();
        }

        function cicloSemana() {
            const modos = ['visit', 'assembly', 'precursor'];
            let idx = modos.indexOf(datos.modo);
            datos.modo = modos[(idx + 1) % modos.length];
            if (navigator.vibrate) navigator.vibrate(60);
            guardar();
            render();
        }

        function activarSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('sos-overlay').style.display = 'flex';
        }

        function tick() {
            const d = new Date();
            document.getElementById('hora').innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        setInterval(tick, 1000);
        tick();
        render();
    </script>
</body>
</html>
