*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010;
  --b1:#0d1f42;
  --blue:#4da8f8;--blue2:#7ec8ff;--blue-d:rgba(30,95,168,0.7);

html,body{

}
</style>

<body>

<div class="car-wrap">
<div class="carousel" id="car">

      <div class="h-cong" id="h-cong">Sin datos</div>
      <div class="h-city" id="h-city">—</div>

        <div class="stat"><div class="stat-v" id="s-eb">—</div><div class="stat-l">Prom EB</div></div>

<script>
// --- MOTOR DE SINCRONIZACIÓN ---
const firebaseConfig = JSON.parse(__firebase_config);
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

let ST = {cong:null, visita:null, chks:{}};

// Iniciar antena de datos (Regla 1 y 3)
firebase.auth().signInAnonymously().then(() => {
    db.collection('artifacts').doc(appId)
      .collection('public').doc('data')
      .collection('itinerario').doc('actual')
      .onSnapshot((doc) => {
          if (doc.exists) {
              const remoteData = doc.data().data;
              const dbClean = remoteData.data || remoteData;
              
              // Lógica de selección automática de la última congregación/visita
              let bestC = dbClean.congregaciones[0];
              let bestV = (bestC.visitas || [])[(bestC.visitas || []).length - 1];
              
              ST.cong = bestC;
              ST.visita = bestV;
              render();
              document.getElementById('sync-status').innerText = "📡 ACTUALIZADO";
              setTimeout(() => { document.getElementById('sync-status').innerText = "📡 SINCRONIZADO"; }, 2000);
          }
      });
});

function doc(id){return document.getElementById(id);}
const PAGES=6; let cur=0;
function buildDots(){
  const c=doc('nav-dots');c.innerHTML='';
  for(let i=0;i<PAGES;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===0?' on':'');
    d.onclick=()=>goTo(i);c.appendChild(d);
  }
}
function goTo(n){
  cur=n;
  doc('car').style.transform=`translateX(-${cur*(100/PAGES)}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
}
buildDots();

// Navegación
let _sx=0;
document.body.addEventListener('touchstart',e=>{_sx=e.touches[0].clientX;},{passive:true});
document.body.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_sx;
  if(dx<-44&&cur<PAGES-1)goTo(cur+1);
  else if(dx>44&&cur>0)goTo(cur-1);
},{passive:true});

// Renderizado original adaptado
function render(){
  if(!ST.cong || !ST.visita) return;
  const c=ST.cong, v=ST.visita;

  doc('h-cong').textContent=c.nombre;
  doc('h-city').textContent=c.ciudad||'—';
  doc('s-eb').textContent = (v.eb || []).length ? v.eb[0] : '—';
  doc('s-rp').textContent = (v.rp || []).length ? v.rp[0] : '—';

  // Checklist
  const items = [];
  if(v.pastoreo) v.pastoreo.forEach((p,i) => items.push({id:'p'+i, t: '🏠 '+(p.familia||'Pastoreo')}));
  if(v.reu_vm_dia) items.push({id:'vm', t: '⚡ Reunión VMC'});
  
  doc('chk-wrap').innerHTML = items.map(it => `
    <div class="chk" onclick="this.classList.toggle('done')">
      <div class="chk-ring">✓</div>
      <div class="chk-txt">${it.t}</div>
    </div>
  `).join('');

  // Reuniones
  doc('vm-d').textContent=v.reu_vm_dia||'—';
  doc('vm-h').textContent=v.reu_vm_hora||'—';
  doc('rp-d').textContent=v.reu_rp_dia||'—';
  doc('rp-h').textContent=v.reu_rp_hora||'—';
}

// Cronómetro (Tu lógica original)
let _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,500); }
function tPause(){ if(!_run)return; _run=false; clearInterval(_iv); _pms=Date.now()-_ts; }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; doc('t-disp').textContent='00:00'; }
function tTick(){
  const ms=Date.now()-_ts; const s=Math.floor(ms/1000);
  const m=Math.floor(s/60),ss=s%60;
  doc('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}
</script>
</body>
