<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>CircuitoWatch 360</title>
<style>
/* ════════════════════════════════════════
   DISEÑO ORIGINAL DE BENJAMÍN (100% INTEGRAL)
   Galaxy Watch 7 · 432 × 432 px
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000010;
  --b1:#0d1f42;
  --blue:#4da8f8;--blue2:#7ec8ff;--blue-d:rgba(30,95,168,0.7);
  --gold:#ffd060;--green:#5ce875;--red:#ff6060;--purple:#c084fc;
  --text:#e8f4ff;--dim:#6a8fb8;--dim2:#3a5a7a;
  --sz:432px;--half:216px;
}

html,body{
  width:100%;height:100%;max-width:var(--sz);max-height:var(--sz);
  overflow:hidden;background:var(--bg);
  font-family:'Segoe UI',Tahoma,Geneva,sans-serif;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

/* Efecto Máscara Circular AMOLED para Watch 7 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background: 
    radial-gradient(circle at center,transparent 83%,rgba(0,0,16,0.95) 100%),
    radial-gradient(circle at center,transparent 90%,#000010 100%);
}

/* CAROUSEL MASTER */
.car-wrap{overflow:hidden;width:100%;height:100%;}
.carousel{
  display:flex;width:600%;height:100%;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.page{
  width:calc(100%/6);height:100%;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.sz{ width:320px;display:flex;flex-direction:column;align-items:center; position:relative;z-index:1; }
.sz.scroll{overflow-y:auto;max-height:305px;padding-bottom:50px;}
.sz.scroll::-webkit-scrollbar{display:none;}

/* CABECERAS ORIGINALES */
.pg-h{ font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700; color:var(--dim);margin-bottom:10px;text-align:center; }
.pg-h.blue{color:var(--blue);} .pg-h.gold{color:var(--gold);} .pg-h.green{color:var(--green);} .pg-h.purple{color:var(--purple);}

.h-date{font-size:9.5px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:2px;}
.h-cong{
  font-size:15px;font-weight:700;color:#fff;text-align:center;
  line-height:1.22;margin:3px 0 1px;max-width:215px;
  text-shadow:0 0 22px rgba(77,168,248,0.4);
}
.h-city{font-size:9px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}

/* CARDS DE ESTADÍSTICAS */
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:205px;}
.stat{
  background:rgba(255,255,255,0.04);border:1px solid rgba(77,168,248,0.15);
  border-radius:9px;padding:7px 4px;text-align:center;
}
.stat-v{font-size:22px;font-weight:700;font-family:monospace;color:var(--blue);}
.stat-l{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;}

/* CHECKLIST */
.chk-wrap{width:100%;padding:0 34px;}
.chk{
  display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:4px;
  border-radius:10px;background:rgba(255,255,255,0.035);
  border:1px solid rgba(92,232,117,0.1); cursor:pointer; min-height:42px;
}
.chk.done{ background:rgba(92,232,117,0.07); opacity:0.4; text-decoration:line-through; }
.chk-ring{
  width:24px;height:24px;min-width:24px;border-radius:50%;
  border:2px solid rgba(92,232,117,0.4);
  display:flex;align-items:center;justify-content:center;
}
.chk.done .chk-ring{ background:var(--green);border-color:var(--green);color:#000; }
.chk-txt{ font-size:10.5px;line-height:1.3; }

/* REUNIONES / COMIDAS / PASTOREO */
.rc{ width:100%;padding:8px 10px;border-radius:10px;margin-bottom:5px; border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03); }
.rc-row{display:flex;justify-content:space-between;align-items:center;}
.rc-nm{font-size:11.5px;color:var(--text);font-weight:600;}
.rc-hr{font-size:12px;color:var(--blue2);font-family:monospace;}

/* CRONÓMETRO ORIGINAL */
.t-disp{ font-family:monospace;font-size:54px;font-weight:700; color:var(--blue);letter-spacing:5px;line-height:1; margin-bottom:10px; }
.tb{ width:54px;height:54px;border-radius:50%;border:none; cursor:pointer;font-size:20px; display:flex;align-items:center;justify-content:center; }
.tb-go{background:linear-gradient(135deg,#1a7a3a,#0a4a1a);border:2px solid rgba(92,232,117,0.25);color:white;}
.tb-rs{background:linear-gradient(135deg,#7a1e1e,#4a0d0d);border:2px solid rgba(255,96,96,0.2);color:white;}

/* NAVEGACIÓN DOTS */
.nav-dots{ position:fixed;bottom:18px;left:50%;transform:translateX(-50%); display:flex;gap:7px;z-index:100; }
.dot{ width:7px;height:7px;border-radius:50%; background:var(--dim2); }
.dot.on{background:var(--blue);width:16px;border-radius:3.5px;}

/* PANEL DE CARGA (SÓLO PARA EL CELULAR) */
#admin-overlay {
    display: none; position: fixed; inset: 0; background: #000; z-index: 2000;
    flex-direction: column; align-items: center; padding: 40px 20px; overflow-y: auto;
}
.btn-admin-open {
    display: none; margin-top: 15px; background: rgba(255,255,255,0.05);
    border: 1px solid #333; color: var(--dim); padding: 8px 15px; border-radius: 20px; font-size: 10px; font-weight: bold;
}
textarea { width: 100%; height: 250px; background: #111; border: 1px solid #333; color: #4da8f8; padding: 15px; border-radius: 15px; font-family: monospace; font-size: 12px; margin-bottom: 20px; }
.btn-save { width: 100%; background: #4da8f8; color: #000; font-weight: bold; padding: 18px; border-radius: 15px; border: none; }

#sync-tag { position: fixed; top: 38px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: bold; z-index: 1001; padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,0.6); }
</style>
</head>
<body>

<div id="sync-tag" style="color:var(--gold)">CONECTANDO...</div>

<div id="admin-overlay">
    <h2 style="margin-bottom:10px; color:#fff">Sincronizador Benjamín 360</h2>
    <p style="color:#666; font-size:13px; margin-bottom:20px; text-align:center">Copie el texto del JSON de su APK y péguelo abajo.</p>
    <textarea id="json-input" placeholder='Pegue aquí el texto que empieza con {"data": ...'></textarea>
    <button class="btn-save" onclick="subirAlBuzon()">SINCRONIZAR CON EL RELOJ</button>
    <button onclick="document.getElementById('admin-overlay').style.display='none'" style="margin-top:20px; background:none; border:none; color:red; font-weight:bold">CANCELAR</button>
</div>

<div class="car-wrap">
<div class="carousel" id="car">

  <!-- P0: HOME -->
  <div class="page" id="p0">
    <div class="sz">
      <div class="h-date">Semana Actual</div>
      <div class="h-cong" id="h-cong">Sin Datos</div>
      <div class="h-city" id="h-city">Usa el botón abajo en el celular</div>
      <div class="stat-g">
        <div class="stat"><div class="stat-v" id="s-eb">0</div><div class="stat-l">Prom EB</div></div>
        <div class="stat"><div class="stat-v" id="s-rp">0</div><div class="stat-l">Prom RP</div></div>
        <div class="stat"><div class="stat-v" id="s-cur" style="color:var(--blue2)">0</div><div class="stat-l">Cursos</div></div>
        <div class="stat"><div class="stat-v" id="s-pub" style="color:var(--green)">0</div><div class="stat-l">Pub.</div></div>
      </div>
      <!-- ESTE BOTÓN SÓLO SE VE EN EL CELULAR -->
      <button id="btn-config" class="btn-admin-open" onclick="document.getElementById('admin-overlay').style.display='flex'">⚙️ PANEL DE CARGA</button>
    </div>
  </div>

  <!-- P1: AGENDA -->
  <div class="page" id="p1" style="justify-content:flex-start;padding-top:48px">
    <div class="sz scroll">
      <div class="pg-h green">✅ AGENDA DEL DÍA</div>
      <div id="chk-wrap" class="chk-wrap"></div>
    </div>
  </div>

  <!-- P2: REUNIONES -->
  <div class="page" id="p2" style="justify-content:flex-start;padding-top:48px">
    <div class="sz scroll" style="padding:0 34px">
      <div class="pg-h purple">🗓 REUNIONES</div>
      <div id="reu-wrap"></div>
    </div>
  </div>

  <!-- P3: COMIDAS -->
  <div class="page" id="p3" style="justify-content:flex-start;padding-top:48px">
    <div class="sz scroll" style="padding:0 34px">
      <div class="pg-h gold">🍽 COMIDAS</div>
      <div id="com-wrap"></div>
    </div>
  </div>

  <!-- P4: PASTOREO -->
  <div class="page" id="p4" style="justify-content:flex-start;padding-top:48px">
    <div class="sz scroll" style="padding:0 34px">
      <div class="pg-h green">🏠 PASTOREO</div>
      <div id="past-wrap"></div>
    </div>
  </div>

  <!-- P5: CRONÓMETRO -->
  <div class="page" id="p5">
    <div class="sz">
      <div class="pg-h blue">⏱ CRONÓMETRO</div>
      <div class="t-disp" id="t-disp">00:00</div>
      <div class="t-btns" style="display:flex;gap:20px">
        <div class="tb tb-go" onclick="tStart()">▶</div>
        <div class="tb tb-rs" onclick="tReset()">↺</div>
      </div>
    </div>
  </div>

</div>
</div>

<div class="nav-dots" id="nav-dots"></div>

<script>
// --- EL "BUZÓN" SEGURO DE BENJAMÍN ---
// Esta es la llave única para que tu celular y tu reloj se encuentren.
const MI_LLAVE_SECRETA = "benjamin_360_v3_master";

// Función para subir los datos desde el S24 Ultra
async function subirAlBuzon() {
    const texto = document.getElementById('json-input').value;
    if(!texto) return;
    try {
        JSON.parse(texto); // Validar que es JSON real
        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${MI_LLAVE_SECRETA}`, {
            method: 'POST',
            body: texto
        });
        if(res.ok) {
            alert("¡Datos enviados al reloj! El Watch se actualizará pronto.");
            document.getElementById('admin-overlay').style.display = 'none';
            descargarDelBuzon();
        }
    } catch(e) { alert("Error: El texto pegado no es un JSON válido."); }
}

// Función para que el reloj "escuche" los datos
async function descargarDelBuzon() {
    try {
        const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${MI_LLAVE_SECRETA}`);
        if(res.ok) {
            const data = await res.json();
            renderUI(data.data || data);
            document.getElementById('sync-tag').innerText = "SINCRO OK";
            document.getElementById('sync-tag').style.color = "var(--green)";
        }
    } catch(e) { document.getElementById('sync-tag').innerText = "BUSCANDO..."; }
}

function renderUI(d) {
    const cong = d.congregaciones[0];
    const v = (cong.visitas || []).slice(-1)[0];

    document.getElementById('h-cong').innerText = cong.nombre;
    document.getElementById('h-city').innerText = cong.ciudad || 'Circuito 360';
    document.getElementById('s-eb').innerText = (v.eb || [])[0] || '0';
    document.getElementById('s-rp').innerText = (v.rp || [])[0] || '0';
    document.getElementById('s-cur').innerText = (v.cursos || [])[0] || '0';
    document.getElementById('s-pub').innerText = (v.publicadores || [])[0] || '0';

    // Agenda / Checklist
    const agenda = [];
    if(v.reu_vm_dia) agenda.push("⚡ VMC: " + v.reu_vm_hora);
    (v.pastoreo || []).forEach(p => agenda.push("🏠 " + p.familia));
    document.getElementById('chk-wrap').innerHTML = agenda.map(t => `<div class="chk" onclick="this.classList.toggle('done')"><div class="chk-ring">✓</div><span class="chk-txt">${t}</span></div>`).join('');

    // Reuniones
    document.getElementById('reu-wrap').innerHTML = `
        <div class="rc" style="border-left:4px solid var(--purple)"><div class="rc-row"><span class="rc-nm">VMC</span><span class="rc-hr">${v.reu_vm_hora||'—'}</span></div></div>
        <div class="rc" style="border-left:4px solid var(--blue)"><div class="rc-row"><span class="rc-nm">PÚBLICA</span><span class="rc-hr">${v.reu_rp_hora||'—'}</span></div></div>
    `;

    // Comidas
    document.getElementById('com-wrap').innerHTML = (v.comidas || []).map(c => `
        <div class="rc" style="border-left:4px solid var(--gold)"><div class="rc-row"><span class="rc-nm">${c.familia}</span><span class="rc-hr">${c.hora||''}</span></div></div>
    `).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';

    // Pastoreo
    document.getElementById('past-wrap').innerHTML = (v.pastoreo || []).map(p => `
        <div class="rc" style="border-left:4px solid var(--green)"><div class="rc-row"><span class="rc-nm">${p.familia}</span><span class="rc-hr">${p.hora||''}</span></div></div>
    `).join('') || '<p style="font-size:10px;color:var(--dim);text-align:center">Sin datos</p>';
}

// Mostrar botón de configuración solo en pantallas grandes (Celular)
if(window.innerWidth > 400) {
    document.getElementById('btn-config').style.display = 'block';
}

// Navegación original mantenida al 100%
let cur = 0; const PAGES = 6;
function buildDots(){
    const c=document.getElementById('nav-dots'); c.innerHTML='';
    for(let i=0;i<PAGES;i++){
        const d=document.createElement('div');
        d.className='dot'+(i===0?' on':'');
        c.appendChild(d);
    }
}
function goTo(n){
    cur = n;
    document.getElementById('car').style.transform = `translateX(-${cur*(100/6)}%)`;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d,i) => d.classList.toggle('on', i === cur));
}
buildDots();
document.body.addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON' || e.target.closest('.chk')) return;
    cur = (cur + 1) % PAGES; goTo(cur);
});

// Cronómetro original de Benjamín (30 min)
let _run=false,_ts=0,_pms=0,_iv=null;
function tStart(){ if(_run)return; _run=true; _ts=Date.now()-_pms; _iv=setInterval(tTick,1000); }
function tReset(){ _run=false; clearInterval(_iv); _ts=0;_pms=0; document.getElementById('t-disp').textContent='00:00'; }
function tTick(){
    const s=Math.floor((Date.now()-_ts)/1000);
    const m=Math.floor(s/60),ss=s%60;
    document.getElementById('t-disp').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

setInterval(descargarDelBuzon, 15000); descargarDelBuzon();
</script>
</body>
</html>
