    <script>

        // Para que sea siempre la misma para ti, usaremos una fija:
        const MY_KEY = "benjamin_360_master_sync";

        async function enviarAlReloj() {
            const text = document.getElementById('jsonInput').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnEnviar');

            if(!text.trim()) {
                status.innerText = "ERROR: EL CAMPO ESTÁ VACÍO";
                status.style.color = "#ff6060";
                return;
            }

            try {
                // Verificamos que sea JSON válido
                JSON.parse(text);
                
                status.innerText = "SINCRONIZANDO...";
                btn.disabled = true;
                btn.style.opacity = "0.5";

                // Guardamos en el buzón público KVDB (Gratuito y sin registro)
                const res = await fetch(`https://kvdb.io/S9L5GqBv6vJqYx7uJp7uJp/${MY_KEY}`, {
                    method: 'POST',
                    body: text
                });

                if(res.ok) {
                    status.innerText = "¡SINCRONIZADO CON ÉXITO!";
                    status.style.color = "#5ce875";
                    document.getElementById('jsonInput').value = "";
                } else {
                    throw new Error();
                }
            } catch (e) {
                status.innerText = "ERROR: EL TEXTO NO ES UN JSON VÁLIDO";
                status.style.color = "#ff6060";
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }
    </script>
